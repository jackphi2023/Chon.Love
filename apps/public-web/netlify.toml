# RETIRED AS A PRODUCTION TARGET.
# Chon.Love production is deployed only from repository-root /netlify.toml and
# publishes apps/mobile/dist. This guard prevents an old Netlify package selection
# from silently bringing the former combined public-web + /app architecture back.
# The Next.js code is retained only as non-production source for future SEO/public
# profile extraction and can still be built manually with:
#   pnpm --filter @myfan/public-web build

[build]
  command = "echo 'apps/public-web is not a Chon.Love production Netlify target. Use repository root netlify.toml.' && exit 1"
  publish = "apps/public-web/.next"

[build.environment]
  NODE_VERSION = "22.23.1"
  PNPM_VERSION = "10.15.1"
