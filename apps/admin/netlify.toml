[build]
  command = "corepack enable && pnpm --filter @myfan/admin build"
  publish = "apps/admin/out"

[build.environment]
  NODE_VERSION = "22.23.1"
  PNPM_VERSION = "10.15.1"

[context.production.environment]
  NEXT_PUBLIC_MYFAN_ENV = "production"
  NEXT_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

[context.develop.environment]
  NEXT_PUBLIC_MYFAN_ENV = "development"
  NEXT_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

[context."release/staging".environment]
  NEXT_PUBLIC_MYFAN_ENV = "staging"
  NEXT_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

[context.deploy-preview.environment]
  NEXT_PUBLIC_MYFAN_ENV = "development"
  NEXT_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

[context.branch-deploy.environment]
  NEXT_PUBLIC_MYFAN_ENV = "development"
  NEXT_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
