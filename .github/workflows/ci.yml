name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Validate environments
        run: pnpm validate:environments

      - name: Validate security source
        run: pnpm validate:security

      - name: Validate integration source
        run: pnpm validate:integration

      - name: Validate auth and session source
        run: pnpm validate:auth

      - name: Validate core social source
        run: pnpm validate:social-e2e

      - name: Validate browser E2E source
        run: pnpm validate:browser-e2e

      - name: Validate VietQR reconciliation source
        run: pnpm validate:vietqr-reconciliation

      - name: Validate KYC and withdrawal operations source
        run: pnpm validate:kyc-withdrawal-operations

      - name: Validate runtime quality source
        run: pnpm validate:runtime-quality

      - name: Validate canonical Netlify release source
        run: pnpm validate:netlify-release

      - name: Validate Chon.Love branding and retired legacy surfaces
        run: pnpm validate:branding

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build Admin and canonical Chon.Love Expo Web
        run: |
          pnpm build
          test -f apps/admin/out/login/index.html
          test -f apps/admin/out/users/index.html

