name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Validate environments
        run: pnpm validate:environments

      - name: Validate BR-01 security source
        run: pnpm validate:security

      - name: Validate BR-02 Beta integration source
        run: pnpm validate:integration

      - name: Validate BR-03 auth and session source
        run: pnpm validate:auth

      - name: Validate BR-04 core social E2E source
        run: pnpm validate:social-e2e

      - name: Validate BR-05 Creator Activity E2E source
        run: pnpm validate:creator-e2e

      - name: Validate BR-06 mobile web browser E2E source
        run: pnpm validate:browser-e2e

      - name: Validate BR-07 VietQR reconciliation source
        run: pnpm validate:vietqr-reconciliation

      - name: Validate BR-08 KYC and withdrawal operational source
        run: pnpm validate:kyc-withdrawal-operations

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web applications and Expo web
        run: pnpm build

  br09-apply-source:
    if: github.ref_name == 'agent/br-09-observability-accessibility-resilience' || github.head_ref == 'agent/br-09-observability-accessibility-resilience'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BR-09 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Restore staged implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .br09-source.part* | base64 --decode > /tmp/br09-source.tar.gz
          echo 'b04b29d4f0bf0a24b55c727fa032249079b559b1b548cf3676391b29a8fb7464  /tmp/br09-source.tar.gz' | sha256sum --check
          mkdir -p /tmp/br09-source
          tar -xzf /tmp/br09-source.tar.gz -C /tmp/br09-source
          tar -cf - -C /tmp/br09-source . | tar -xf -
          rm -f .br09-source.part*
          git checkout HEAD -- .github/workflows/ci.yml

      - name: Commit implementation source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement BR-09 runtime quality controls'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
