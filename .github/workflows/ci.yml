name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web applications and Expo web
        run: pnpm build

      - name: Upload generated lockfile for foundation commit
        if: always() && hashFiles('pnpm-lock.yaml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 3
