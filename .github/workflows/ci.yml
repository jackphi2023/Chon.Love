name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Validate environments
        run: pnpm validate:environments

      - name: Validate BR-01 security source
        run: pnpm validate:security

      - name: Validate BR-02 Beta integration source
        run: pnpm validate:integration

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web applications and Expo web
        run: pnpm build
