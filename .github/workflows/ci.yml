name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Validate environments
        run: pnpm validate:environments

      - name: Validate BR-01 security source
        run: pnpm validate:security

      - name: Validate BR-02 Beta integration source
        run: pnpm validate:integration

      - name: Validate BR-03 auth and session source
        run: pnpm validate:auth

      - name: Validate BR-04 core social E2E source
        run: pnpm validate:social-e2e

      - name: Validate BR-05 Creator Activity E2E source
        run: pnpm validate:creator-e2e

      - name: Validate BR-06 mobile web browser E2E source
        run: pnpm validate:browser-e2e

      - name: Validate BR-07 VietQR reconciliation source
        run: pnpm validate:vietqr-reconciliation

      - name: Validate BR-08 KYC and withdrawal operational source
        run: pnpm validate:kyc-withdrawal-operations

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web applications and Expo web
        run: pnpm build

  br08-type-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/br-08-kyc-withdrawal-operational-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout BR-08 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Generate exact public database contract
        shell: bash
        run: |
          supabase start
          supabase db reset --local
          supabase gen types typescript --local --schema public > packages/supabase/src/database.types.ts
          supabase stop --no-backup

      - name: Commit generated contract
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/ci.yml
          if git diff --quiet -- packages/supabase/src/database.types.ts; then
            echo 'Database types already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/supabase/src/database.types.ts
          git commit -m 'Sync BR-08 generated database types'
          git push origin HEAD:${GITHUB_HEAD_REF}
