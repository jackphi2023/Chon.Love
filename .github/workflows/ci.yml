name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm validate:workspace

      - name: Validate environments
        run: pnpm validate:environments

      - name: Validate BR-01 security source
        run: pnpm validate:security

      - name: Validate BR-02 Beta integration source
        run: pnpm validate:integration

      - name: Validate BR-03 auth and session source
        run: pnpm validate:auth

      - name: Validate BR-04 core social E2E source
        run: pnpm validate:social-e2e

      - name: Validate BR-05 Creator Activity E2E source
        run: pnpm validate:creator-e2e

      - name: Validate BR-06 mobile web browser E2E source
        run: pnpm validate:browser-e2e

      - name: Validate BR-07 VietQR reconciliation source
        run: pnpm validate:vietqr-reconciliation

      - name: Validate BR-08 KYC and withdrawal operational source
        run: pnpm validate:kyc-withdrawal-operations

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web applications and Expo web
        run: pnpm build

  br09-source-snapshot:
    if: github.ref_name == 'agent/br-09-observability-accessibility-resilience' || github.head_ref == 'agent/br-09-observability-accessibility-resilience'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BR-09 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Create source archive
        run: tar --exclude='.git' --exclude='node_modules' -czf /tmp/myfan-br09-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: br-09-source-snapshot
          path: /tmp/myfan-br09-source.tar.gz
          if-no-files-found: error
          retention-days: 1
