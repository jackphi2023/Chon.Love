name: LX-15 Regenerate Types

on:
  push:
    branches: ['agent/lx-15-messaging-entitlement']
    paths:
      - '.github/workflows/lx15-regenerate-types.yml'

permissions:
  contents: write

concurrency:
  group: lx15-regenerate-types
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/lx-15-messaging-entitlement
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Start local Supabase
        run: supabase start

      - name: Clean reset from repository migrations
        run: supabase db reset --local

      - name: Regenerate public TypeScript contract
        run: supabase gen types typescript --local --schema public > packages/supabase/src/database.types.ts

      - name: Commit generated contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/supabase/src/database.types.ts
          if git diff --cached --quiet; then
            echo 'Generated contract already current.'
            exit 0
          fi
          git commit -m 'LX-15: refresh generated database types'
          git push origin HEAD:agent/lx-15-messaging-entitlement

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
