          auth = replace_once(auth, "  if (!data.session) throw new Error('otp_session_missing');\n  return getAuthenticatedDestination();", "  if (!data.session) throw new Error('otp_session_missing');\n  await restoreSignupDraftFromAuthenticatedUser();\n  return getAuthenticatedDestination();", 'otp restore')
