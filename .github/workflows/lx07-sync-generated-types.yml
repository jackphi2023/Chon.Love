name: LX07 Sync Generated Types

on:
  push:
    branches: ['agent/luxy-seeking-ui-foundation']

permissions:
  contents: write

concurrency:
  group: lx07-sync-generated-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/luxy-seeking-ui-foundation

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild repository schema
        run: supabase db reset --local

      - name: Generate exact public database contract
        run: supabase gen types typescript --local --schema public > /tmp/database.types.ts

      - name: Commit generated contract if changed
        run: |
          if cmp --silent /tmp/database.types.ts packages/supabase/src/database.types.ts; then
            echo 'Generated database contract is already synchronized.'
            exit 0
          fi
          cp /tmp/database.types.ts packages/supabase/src/database.types.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/supabase/src/database.types.ts
          git commit -m 'LX-07 sync generated database types'
          git push origin HEAD:agent/luxy-seeking-ui-foundation

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
