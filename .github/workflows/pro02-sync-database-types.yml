name: PRO02 Temporary Database Type Sync

on:
  push:
    branches: ['agent/ui-home-nav-consistency-v1']
    paths:
      - '.github/workflows/pro02-sync-database-types.yml'
      - 'packages/supabase/src/database.types.ts'
      - 'supabase/**'
      - 'scripts/filter-internal-database-types.mjs'

permissions:
  contents: write

concurrency:
  group: pro02-dbtype-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-home-nav-consistency-v1
          fetch-depth: 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Generate exact local public client contract
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          for attempt in 1 2 3; do
            if supabase gen types typescript --local --schema public > /tmp/database.types.attempt.ts; then
              mv /tmp/database.types.attempt.ts /tmp/database.types.ts
              break
            fi
            rm -f /tmp/database.types.attempt.ts
            sleep $((attempt * 10))
          done
          test -s /tmp/database.types.ts
          node scripts/filter-internal-database-types.mjs /tmp/database.types.ts
          cp /tmp/database.types.ts packages/supabase/src/database.types.ts

      - name: Commit generated contract only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/supabase/src/database.types.ts; then
            echo 'database.types.ts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/supabase/src/database.types.ts
          git commit -m 'chore(db): sync generated public contract'
          git push origin HEAD:agent/ui-home-nav-consistency-v1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
