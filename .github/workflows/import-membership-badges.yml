name: Import canonical membership badges

on:
  push:
    branches: ['agent/fix-production-media-badges-icons']
    paths:
      - '.asset-import/**'
      - '.github/workflows/import-membership-badges.yml'
  pull_request:
    branches: ['main']
    paths:
      - '.asset-import/**'
      - '.github/workflows/import-membership-badges.yml'

permissions:
  contents: write

jobs:
  import-badges:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-production-media-badges-icons
          fetch-depth: 0

      - name: Build canonical high-resolution badge assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/assets/luxy /tmp/chon-badges

          # The transport files were created only to carry the user-approved raster
          # artwork through a text-only GitHub connector. The Premium transport lost
          # a few trailing bytes, so do not treat its checksum as source-of-truth.
          cat .asset-import/premium.*.b64 | tr -d '\n' | base64 -d > /tmp/chon-badges/premium-transport.webp || true
          cat .asset-import/diamond.*.b64 | tr -d '\n' | base64 -d > /tmp/chon-badges/diamond-transport.webp || true

          normalize_badge() {
            local transport="$1"
            local fallback="$2"
            local output="$3"

            # Prefer the transported canonical raster when the decoder can recover it.
            # Otherwise use the existing canonical raster asset. No badge is redrawn.
            if ffmpeg -v error -err_detect ignore_err -i "$transport" \
              -vf "scale=768:512:flags=lanczos" -frames:v 1 -c:v libwebp -quality 92 -y "$output"; then
              echo "Normalized transported canonical artwork: $output"
            else
              ffmpeg -v error -i "$fallback" \
                -vf "scale=768:512:flags=lanczos" -frames:v 1 -c:v libwebp -quality 92 -y "$output"
              echo "Normalized repository canonical artwork: $output"
            fi
          }

          normalize_badge /tmp/chon-badges/premium-transport.webp apps/mobile/assets/luxy/premium-badge.png apps/mobile/assets/luxy/premium-badge-hq.webp
          normalize_badge /tmp/chon-badges/diamond-transport.webp apps/mobile/assets/luxy/diamond-badge.png apps/mobile/assets/luxy/diamond-badge-hq.webp

          test -s apps/mobile/assets/luxy/premium-badge-hq.webp
          test -s apps/mobile/assets/luxy/diamond-badge-hq.webp
          file apps/mobile/assets/luxy/premium-badge-hq.webp apps/mobile/assets/luxy/diamond-badge-hq.webp
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 apps/mobile/assets/luxy/premium-badge-hq.webp | grep -qx '768x512'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 apps/mobile/assets/luxy/diamond-badge-hq.webp | grep -qx '768x512'

      - name: Commit assets and remove one-time transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-import
          rm .github/workflows/import-membership-badges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add canonical high-resolution membership badge artwork'
          git push origin HEAD:agent/fix-production-media-badges-icons
