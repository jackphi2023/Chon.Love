name: LX-10 Browser Selector Fix

on:
  push:
    branches: ['agent/luxy-seeking-ui-foundation']
    paths:
      - '.github/workflows/lx10-browser-selector-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/luxy-seeking-ui-foundation
          fetch-depth: 0

      - name: Patch stable selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          search = Path('apps/mobile/src/components/luxy-search-desktop.tsx')
          text = search.read_text()
          old = '''              <Pressable
                accessibilityRole="button"
                onPress={() => setSortOpen((value) => !value)}
                style={styles.sortButton}
              >'''
          new = '''              <Pressable
                accessibilityRole="button"
                onPress={() => setSortOpen((value) => !value)}
                style={styles.sortButton}
                testID="luxy-search-sort-button"
              >'''
          if old not in text:
              raise SystemExit('sort button target not found')
          text = text.replace(old, new, 1)

          old = '''                    <Pressable
                      accessibilityRole="button"
                      key={option.value}
                      onPress={() => {'''
          new = '''                    <Pressable
                      accessibilityRole="button"
                      key={option.value}
                      testID={`luxy-search-sort-${option.value}`}
                      onPress={() => {'''
          if old not in text:
              raise SystemExit('sort option target not found')
          search.write_text(text.replace(old, new, 1))

          for filename in ['luxy-edit-profile.spec.mjs', 'luxy-settings.spec.mjs']:
              path = Path('tests/br-06') / filename
              text = path.read_text()
              old = "await expect(page.getByText('Khám phá', { exact: true }).first()).toBeVisible({ timeout: 30_000 });"
              new = "await expect(page.getByText('Tìm kiếm', { exact: true }).first()).toBeVisible({ timeout: 30_000 });"
              if old not in text:
                  raise SystemExit(f'login target not found in {filename}')
              path.write_text(text.replace(old, new, 1))

          search_test = Path('tests/br-06/luxy-search-desktop.spec.mjs')
          text = search_test.read_text()
          old = '''    const sortButton = results.getByRole('button', { name: 'Gần nhất', exact: true });
    await expect(sortButton).toBeVisible();
    await sortButton.click();
    await expect(results.getByRole('button', { name: 'Hoạt động gần đây', exact: true })).toBeVisible();
    await results.getByRole('button', { name: 'Hoạt động gần đây', exact: true }).click();
    await expect(results.getByRole('button', { name: 'Hoạt động gần đây', exact: true })).toBeVisible();'''
          new = '''    const sortButton = page.getByTestId('luxy-search-sort-button');
    await expect(sortButton).toBeVisible();
    await expect(sortButton).toContainText('Gần nhất');
    await sortButton.click();
    const recentSort = page.getByTestId('luxy-search-sort-recent');
    await expect(recentSort).toBeVisible();
    await recentSort.click();
    await expect(sortButton).toContainText('Hoạt động gần đây');'''
          if old not in text:
              raise SystemExit('search sort test target not found')
          search_test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/components/luxy-search-desktop.tsx tests/br-06/luxy-edit-profile.spec.mjs tests/br-06/luxy-settings.spec.mjs tests/br-06/luxy-search-desktop.spec.mjs
          git rm .github/workflows/lx10-browser-selector-fix.yml
          git commit -m 'LX-10 stabilize desktop Search browser regressions'
          git push origin HEAD:agent/luxy-seeking-ui-foundation
