name: BR-08 Bootstrap

on:
  workflow_dispatch:
  push:
    branches: ['agent/br-08-kyc-withdrawal-operational-flow']
    paths:
      - '.github/workflows/br08-bootstrap.yml'
      - '.br08/**'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install BR-08 source bundle
        shell: bash
        run: |
          cat .br08/chunk* | base64 -d > /tmp/br08-bundle.tar.gz
          tar -xzf /tmp/br08-bundle.tar.gz -C .
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['validate:kyc-withdrawal-operations'] = 'node scripts/validate-br08.mjs'
          if 'validate:kyc-withdrawal-operations' not in package['scripts']['validate']:
              package['scripts']['validate'] += ' && pnpm validate:kyc-withdrawal-operations'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          index_path = Path('packages/supabase/src/index.ts')
          index = index_path.read_text()
          marker = "export * from './vietqr-reconciliation';\n"
          if "export * from './kyc-withdrawal-operations';" not in index:
              assert marker in index
              index = index.replace(marker, marker + "export * from './kyc-withdrawal-operations';\n")
          index_path.write_text(index)

          login_path = Path('apps/admin/app/admin-login.tsx')
          login = login_path.read_text()
          marker = '          <Link className="adminSecondary" href="/vietqr-reconciliation">Đối soát VietQR</Link>\n'
          if 'href="/kyc-withdrawal-operations"' not in login:
              assert marker in login
              login = login.replace(marker, marker + '          <Link className="adminSecondary" href="/kyc-withdrawal-operations">KYC và rút tiền</Link>\n')
          login = login.replace('Đối soát VietQR yêu cầu finance_admin hoặc super_admin.', 'Đối soát VietQR và vận hành KYC/rút tiền yêu cầu finance_admin hoặc super_admin.')
          login_path.write_text(login)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          marker = '      - name: Validate BR-07 VietQR reconciliation source\n        run: pnpm validate:vietqr-reconciliation\n'
          if 'Validate BR-08 KYC and withdrawal operational source' not in ci:
              assert marker in ci
              ci = ci.replace(marker, marker + '\n      - name: Validate BR-08 KYC and withdrawal operational source\n        run: pnpm validate:kyc-withdrawal-operations\n')
          ci_path.write_text(ci)

          db_path = Path('.github/workflows/database.yml')
          db = db_path.read_text()
          db = db.replace("      - 'scripts/validate-br07.mjs'\n", "      - 'scripts/validate-br07.mjs'\n      - 'scripts/validate-br08.mjs'\n")
          db = db.replace("      - 'docs/br-07/**'\n", "      - 'docs/br-07/**'\n      - 'docs/br-08/**'\n")
          inventory_marker = '          test -f supabase/migrations/20260731185855_br_07_vietqr_reconciliation_mvp.sql\n'
          if '20260731192600_br_08_kyc_withdrawal_operational_flow.sql' not in db:
              assert inventory_marker in db
              db = db.replace(inventory_marker, inventory_marker + '          test -f supabase/migrations/20260731192600_br_08_kyc_withdrawal_operational_flow.sql\n')
          function_marker = '          test -f supabase/functions/vietqr-reconciliation-admin/index.ts\n'
          if 'test -f supabase/functions/payout-admin/index.ts' not in db:
              assert function_marker in db
              db = db.replace(function_marker, function_marker + '          test -f supabase/functions/payout-admin/index.ts\n')
          test_marker = '          test -f supabase/tests/br_07_vietqr_reconciliation_mvp.sql\n'
          if 'test -f supabase/tests/br_08_kyc_withdrawal_operational_flow.sql' not in db:
              assert test_marker in db
              db = db.replace(test_marker, test_marker + '          test -f supabase/tests/br_08_kyc_withdrawal_operational_flow.sql\n')
          script_marker = '          test -f scripts/validate-br07.mjs\n'
          if 'test -f scripts/validate-br08.mjs' not in db:
              assert script_marker in db
              db = db.replace(script_marker, script_marker + '          test -f scripts/validate-br08.mjs\n')
          run_marker = '      - name: Run BR-07 VietQR reconciliation MVP\n        run: supabase test db supabase/tests/br_07_vietqr_reconciliation_mvp.sql --local\n'
          if 'Run BR-08 KYC and withdrawal operational flow' not in db:
              assert run_marker in db
              db = db.replace(run_marker, run_marker + '\n      - name: Run BR-08 KYC and withdrawal operational flow\n        run: supabase test db supabase/tests/br_08_kyc_withdrawal_operational_flow.sql --local\n')
          db = db.replace('name: br-07-database-types', 'name: br-08-database-types')
          db_path.write_text(db)
          PY
          rm -rf .br08

      - name: Commit BR-08 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Implement BR-08 KYC withdrawal operations'
          git push origin HEAD:${GITHUB_REF_NAME}
