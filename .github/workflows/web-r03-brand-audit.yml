name: WEB-R03 Branding Audit

on:
  push:
    branches:
      - release/luxy-web-v1
    paths:
      - .github/workflows/web-r03-brand-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit runtime branding strings
        shell: bash
        run: |
          set -euo pipefail
          command -v grep >/dev/null
          echo '=== USER-FACING / LEGACY BRAND TERMS ==='
          grep -RInE \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' \
            '(MyFan|Creator|Fan|Activity|Hoạt động|LX-[0-9]{2})' \
            apps/mobile apps/public-web apps/admin packages \
            | grep -Ev '(\.test\.|\.spec\.|database\.types\.ts)' || true
          echo
          echo '=== INTERNAL MYFAN IDENTIFIERS / COPY ==='
          grep -RIniE \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' \
            'myfan' \
            apps/mobile apps/public-web apps/admin packages \
            | grep -Ev '(\.test\.|\.spec\.|database\.types\.ts)' || true
