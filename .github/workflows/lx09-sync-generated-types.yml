name: LX-09 Sync Generated Types

on:
  push:
    branches: ['agent/luxy-seeking-ui-foundation']
    paths:
      - '.github/workflows/lx09-sync-generated-types.yml'

permissions:
  contents: write

concurrency:
  group: lx09-sync-generated-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/luxy-seeking-ui-foundation
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Rebuild local database
        run: |
          supabase start
          supabase db reset --local

      - name: Generate committed public database types
        run: |
          for attempt in 1 2 3; do
            if supabase gen types typescript --local --schema public > packages/supabase/src/database.types.ts; then
              test -s packages/supabase/src/database.types.ts
              break
            fi
            echo "Type generation attempt ${attempt} failed; retrying." >&2
            sleep $((attempt * 10))
          done
          grep -q 'search_luxy_profiles_v2' packages/supabase/src/database.types.ts

      - name: Commit generated types
        run: |
          if git diff --quiet -- packages/supabase/src/database.types.ts; then
            echo 'Generated types already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/supabase/src/database.types.ts
          git commit -m 'LX-09 sync generated database types'
          git push origin HEAD:agent/luxy-seeking-ui-foundation

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
