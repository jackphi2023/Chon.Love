name: LX-17 Contract

on:
  push:
    branches: ['agent/lx-17-premium-diamond-engine', 'release/**']
    paths:
      - 'supabase/migrations/20260812183000_lx_17_premium_diamond_engine.sql'
      - 'supabase/tests/lx_17_premium_diamond_engine.sql'
      - 'packages/supabase/src/membership.ts'
      - 'packages/supabase/src/membership.test.ts'
      - 'packages/supabase/src/member-profile.ts'
      - 'packages/supabase/src/interests.ts'
      - 'packages/supabase/src/mailbox.ts'
      - 'supabase/functions/membership-admin/**'
      - '.github/workflows/lx17-contract.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260812183000_lx_17_premium_diamond_engine.sql'
      - 'supabase/tests/lx_17_premium_diamond_engine.sql'
      - 'packages/supabase/src/membership.ts'
      - 'packages/supabase/src/membership.test.ts'
      - 'packages/supabase/src/member-profile.ts'
      - 'packages/supabase/src/interests.ts'
      - 'packages/supabase/src/mailbox.ts'
      - 'supabase/functions/membership-admin/**'
      - '.github/workflows/lx17-contract.yml'

permissions:
  contents: read

concurrency:
  group: lx17-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  membership-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Membership unit contract
        run: pnpm exec vitest run packages/supabase/src/membership.test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Start local Supabase
        run: supabase start

      - name: Clean reset from repository migrations
        run: supabase db reset --local

      - name: Run LX-15 messaging regression
        run: supabase test db supabase/tests/lx_15_direct_messaging_entitlement.sql --local

      - name: Run LX-16 Interests and Messages regression
        run: supabase test db supabase/tests/lx_16_interests_messages_ui.sql --local

      - name: Run LX-17 Premium Diamond contract
        run: supabase test db supabase/tests/lx_17_premium_diamond_engine.sql --local

      - name: Lint membership schemas
        run: |
          supabase db lint --local --schema public --schema private --level warning | tee /tmp/lx17-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('/tmp/lx17-lint.json').read_text().strip()
          findings = json.loads(raw) if raw else []
          errors = [
              (item.get('function'), issue.get('message'))
              for item in findings
              for issue in item.get('issues', [])
              if issue.get('level') == 'error'
          ]
          if errors:
              for function, message in errors:
                  print(f'ERROR {function}: {message}')
              raise SystemExit(1)
          print(f'LX-17 schema lint: zero errors; {len(findings)} warning entries retained.')
          PY

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
