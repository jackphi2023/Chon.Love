name: WEB-R02 Final Visual Fix

on:
  push:
    branches:
      - release/luxy-web-v1
    paths:
      - scripts/web-r02-final-patch.py
      - .github/workflows/web-r02-final-visual-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/luxy-web-v1
      - name: Apply patch
        run: python3 scripts/web-r02-final-patch.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/components/luxy-upgrade-gate-modal.tsx apps/mobile/app/settings/membership.tsx tests/br-06/web-r02-final-ui-qa.spec.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web-r02): isolate web modals and clean screenshot evidence'
          git push origin HEAD:release/luxy-web-v1
