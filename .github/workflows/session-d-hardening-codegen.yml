name: Session D Hardening Codegen

on:
  push:
    branches: ['repair/session-d-fix-20260907']
    paths:
      - '.github/workflows/session-d-hardening-codegen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/session-d-fix-20260907

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded image-format and rate-limit hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          liveness = 'supabase/functions/member-face-liveness/index.ts'
          replace_once(
              liveness,
              "const RATE_LIMIT_RETRY_SECONDS = 30 * 60;",
              "const RATE_LIMIT_RETRY_SECONDS = Math.ceil(RATE_WINDOW_MS / 1000);",
          )
          replace_once(
              liveness,
              "function bytesToBase64(bytes: Uint8Array): string {",
              "function detectImageMimeType(bytes: Uint8Array): 'image/jpeg' | 'image/png' | null {\n"
              "  if (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'image/jpeg';\n"
              "  if (bytes.length >= 8\n"
              "    && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47\n"
              "    && bytes[4] === 0x0d && bytes[5] === 0x0a && bytes[6] === 0x1a && bytes[7] === 0x0a) return 'image/png';\n"
              "  return null;\n"
              "}\n\n"
              "function bytesToBase64(bytes: Uint8Array): string {",
          )
          old_reference = """    const referenceImageSha256 = await sha256Hex(referenceBytes);
    await updateLivenessSession(server, bound.id, {
      state: 'completed',
      aws_status: awsStatus,
      confidence,
      reference_image_sha256: referenceImageSha256,
      completed_at: new Date().toISOString(),
      error_code: null,
    });"""
          new_reference = """    const referenceMimeType = detectImageMimeType(referenceBytes);
    if (!referenceMimeType) {
      await updateLivenessSession(server, bound.id, {
        state: 'completed',
        aws_status: awsStatus,
        confidence,
        completed_at: new Date().toISOString(),
        error_code: 'reference_image_unsupported_format',
      });
      const caseId = await queuePendingReview(server, userId, {
        provider: 'aws_rekognition_face_liveness',
        livenessStatus: awsStatus,
        livenessConfidence: confidence,
        livenessThreshold: bound.threshold,
        pendingReason: 'face_liveness_reference_image_unsupported_format',
        submittedAt: new Date().toISOString(),
      }, GENERIC_PENDING_MESSAGE);
      return respond(200, {
        state: 'pending_review',
        caseId,
        message: GENERIC_PENDING_MESSAGE,
        reason: 'face_liveness_reference_image_unsupported_format',
        retryable: true,
      });
    }

    const referenceImageSha256 = await sha256Hex(referenceBytes);
    await updateLivenessSession(server, bound.id, {
      state: 'completed',
      aws_status: awsStatus,
      confidence,
      reference_image_sha256: referenceImageSha256,
      completed_at: new Date().toISOString(),
      error_code: null,
    });"""
          replace_once(liveness, old_reference, new_reference)
          replace_once(liveness, "        mimeType: 'image/jpeg',", "        mimeType: referenceMimeType,")

          comparison = 'supabase/functions/member-photo-verification/index.ts'
          replace_once(
              comparison,
              "function pageLimit(value: unknown): number {",
              "function detectImageMimeType(bytes: Uint8Array): 'image/jpeg' | 'image/png' | null {\n"
              "  if (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'image/jpeg';\n"
              "  if (bytes.length >= 8\n"
              "    && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47\n"
              "    && bytes[4] === 0x0d && bytes[5] === 0x0a && bytes[6] === 0x1a && bytes[7] === 0x0a) return 'image/png';\n"
              "  return null;\n"
              "}\n\n"
              "function pageLimit(value: unknown): number {",
          )
          replace_once(
              comparison,
              "    if (typeof body.selfieBase64 !== 'string' || body.mimeType !== 'image/jpeg') {\n      return respond(400, { error: 'jpeg_selfie_required' });\n    }\n\n    const selfieBytes = decodeBase64Image(body.selfieBase64);",
              "    if (typeof body.selfieBase64 !== 'string' || (body.mimeType !== 'image/jpeg' && body.mimeType !== 'image/png')) {\n      return respond(400, { error: 'supported_selfie_image_required' });\n    }\n\n    const selfieBytes = decodeBase64Image(body.selfieBase64);\n    const detectedSelfieMimeType = detectImageMimeType(selfieBytes);\n    if (!detectedSelfieMimeType || detectedSelfieMimeType !== body.mimeType) {\n      return respond(400, { error: 'selfie_image_type_mismatch' });\n    }",
          )
          replace_once(
              comparison,
              "    const selfieStoragePath = `${actorId}/${attemptId}/selfie.jpg`;\n    const { error: uploadError } = await server.storage\n      .from('member-verification')\n      .upload(selfieStoragePath, selfieBytes, { contentType: 'image/jpeg', cacheControl: '0', upsert: false });",
              "    const selfieExtension = detectedSelfieMimeType === 'image/png' ? 'png' : 'jpg';\n    const selfieStoragePath = `${actorId}/${attemptId}/selfie.${selfieExtension}`;\n    const { error: uploadError } = await server.storage\n      .from('member-verification')\n      .upload(selfieStoragePath, selfieBytes, { contentType: detectedSelfieMimeType, cacheControl: '0', upsert: false });",
          )

          validator = 'scripts/validate-session-d-face-liveness.mjs'
          replace_once(
              validator,
              "requireText(gateway, 'face_liveness_session_expired', 'expired liveness fails closed');",
              "requireText(gateway, 'face_liveness_session_expired', 'expired liveness fails closed');\n"
              "requireText(gateway, 'detectImageMimeType', 'AWS ReferenceImage format is detected from bytes instead of assumed');\n"
              "requireText(gateway, 'RATE_LIMIT_RETRY_SECONDS = Math.ceil(RATE_WINDOW_MS / 1000)', 'rate-limit retry metadata matches the enforcement window');",
          )
          replace_once(
              validator,
              "requireText(comparison, 'livenessVerified: true', 'moderation audit records liveness proof without exposing confidence to the member');",
              "requireText(comparison, 'livenessVerified: true', 'moderation audit records liveness proof without exposing confidence to the member');\n"
              "requireText(comparison, 'selfie_image_type_mismatch', 'CompareFaces storage MIME must match the cryptographically-bound image bytes');",
          )
          PY

      - name: Validate hardening
        run: |
          node scripts/validate-session-d-face-liveness.mjs
          pnpm lint
          pnpm --filter @myfan/mobile typecheck

      - name: Commit hardened source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/member-face-liveness/index.ts \
            supabase/functions/member-photo-verification/index.ts \
            scripts/validate-session-d-face-liveness.mjs
          git diff --cached --check
          git commit -m 'fix: harden liveness reference image handling'
          git push origin HEAD:repair/session-d-fix-20260907
