name: Session D Final State Codegen

on:
  push:
    branches: ['repair/session-d-fix-20260907']
    paths:
      - '.github/workflows/session-d-final-state-codegen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/session-d-fix-20260907

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded retry-state patch
        run: python3 scripts/session-d-final-state-patch.py

      - name: Validate final Session D source
        run: |
          node scripts/validate-session-d-face-liveness.mjs
          pnpm lint
          pnpm --filter @myfan/mobile typecheck

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/member-photo-verification/index.ts
          git diff --cached --check
          git commit -m 'fix: preserve liveness retry state after reload'
          git push origin HEAD:repair/session-d-fix-20260907
