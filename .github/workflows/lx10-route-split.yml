name: LX-10 Route Split

on:
  push:
    branches: ['agent/luxy-seeking-ui-foundation']
    paths:
      - '.github/workflows/lx10-route-split.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/luxy-seeking-ui-foundation
          fetch-depth: 0

      - name: Preserve legacy mobile discovery and install desktop router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('apps/mobile/app/(tabs)/index.tsx')
          legacy = Path('apps/mobile/src/components/legacy-discovery-screen.tsx')
          text = source.read_text()
          needle = 'export default function Page() {'
          if needle not in text:
              raise SystemExit('legacy discovery entrypoint not found')
          legacy.write_text(text.replace(needle, 'export default function LegacyDiscoveryScreen() {', 1))
          wrapper = '\n'.join([
              "import { luxyBreakpoints } from '@myfan/ui';",
              "import { useWindowDimensions } from 'react-native';",
              "import LegacyDiscoveryScreen from '@/components/legacy-discovery-screen';",
              "import { LuxySearchDesktop } from '@/components/luxy-search-desktop';",
              '',
              'export default function Page() {',
              '  const { width } = useWindowDimensions();',
              '  return width >= luxyBreakpoints.desktop ? <LuxySearchDesktop /> : <LegacyDiscoveryScreen />;',
              '}',
              '',
          ])
          source.write_text(wrapper)
          PY

      - name: Commit route split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/mobile/app/(tabs)/index.tsx' apps/mobile/src/components/legacy-discovery-screen.tsx
          git commit -m 'LX-10 route desktop search without changing mobile discovery'
          git push origin HEAD:agent/luxy-seeking-ui-foundation
