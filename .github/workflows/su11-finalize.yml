name: SU-11 Finalizer

on:
  push:
    branches:
      - feature/signup-onboarding-v2

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[su11-run]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/signup-onboarding-v2
          fetch-depth: 0

      - name: Apply SU-11 release cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Browser accessibility: expose the selected radio state to the DOM.
          replace_once(
              'apps/mobile/app/(auth)/index.tsx',
              "  const webKeyboardProps = Platform.OS === 'web'\n    ? {\n        onKeyDown: (event: WebKeyboardEvent) => {",
              "  const webKeyboardProps = Platform.OS === 'web'\n    ? {\n        'aria-checked': selected,\n        onKeyDown: (event: WebKeyboardEvent) => {",
          )

          # Retire the pre-V2 minimum-onboarding client helper and structural RPC casts.
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "  minimumOnboardingSchema,\n  signupHeadlineBioSchema,",
              "  signupHeadlineBioSchema,",
          )
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "  type MinimumOnboardingInput,\n  type SignupHeadlineBioInput,",
              "  type SignupHeadlineBioInput,",
          )
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "export async function completeMinimumOnboarding(input: MinimumOnboardingInput): Promise<void> {\n  const parsed = minimumOnboardingSchema.parse(input);\n  const client = requireAuthClient();\n  const versions = await getCurrentPolicyVersions();\n  const { error } = await client.rpc('complete_my_onboarding', {\n    p_date_of_birth: parsed.dateOfBirth,\n    p_terms_version: versions.terms,\n    p_community_rules_version: versions.communityRules,\n    p_age_verification_method: 'self_declared',\n  });\n  if (error) throw error;\n}\n\n",
              "",
          )
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "  // SU-05 is intentionally kept on a structural RPC boundary while the full\n  // Signup V2 branch is still staged. The DB migration + pgTAP contract are\n  // authoritative; SU-11 will perform the final generated-types checkpoint.\n  const { error } = await client.rpc(\n    'save_my_signup_location_v2' as never,\n    {\n      p_province_id: parsed.provinceId,\n      ...(location ? {\n        p_latitude: location.latitude,\n        p_longitude: location.longitude,\n        p_accuracy_meters: location.accuracyMeters,\n        p_captured_at: location.capturedAt,\n        p_source: location.source,\n      } : {}),\n    } as never,\n  );",
              "  const { error } = await client.rpc('save_my_signup_location_v2', {\n    p_province_id: parsed.provinceId,\n    ...(location ? {\n      p_latitude: location.latitude,\n      p_longitude: location.longitude,\n      p_accuracy_meters: location.accuracyMeters,\n      p_captured_at: location.capturedAt,\n      p_source: location.source,\n    } : {}),\n  });",
          )
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "  // Keep the staged SU-06 RPC on the same temporary generated-type boundary as\n  // SU-05. Database migration + pgTAP own the authoritative contract until the\n  // final SU-11 contract generation checkpoint.\n  const { error } = await client.rpc(\n    'save_my_signup_looking_for_v2' as never,\n    {\n      p_looking_for: parsed.lookingFor,\n      p_lifestyle_tags: parsed.lifestyleTags,\n    } as never,\n  );",
              "  const { error } = await client.rpc('save_my_signup_looking_for_v2', {\n    p_looking_for: parsed.lookingFor,\n    p_lifestyle_tags: parsed.lifestyleTags,\n  });",
          )
          replace_once(
              'apps/mobile/src/lib/onboarding.ts',
              "  // SU-08 stays on the integration-only structural boundary until SU-11 emits\n  // the final generated database contract. The staged RPC itself remains\n  // authenticated/incomplete-profile-only and never activates discovery.\n  const { error } = await client.rpc(\n    'save_my_signup_headline_bio_v2' as never,\n    {\n      p_bio: parsed.bio,\n      ...(parsed.headline ? { p_headline: parsed.headline } : {}),\n    } as never,\n  );",
              "  const { error } = await client.rpc('save_my_signup_headline_bio_v2', {\n    p_bio: parsed.bio,\n    ...(parsed.headline ? { p_headline: parsed.headline } : {}),\n  });",
          )

          # SU-11 final generated database client contract.
          marker = "      save_my_signup_personal_info_v2: {\n"
          generated = """      save_my_signup_headline_bio_v2: {
        Args: { p_bio: string; p_headline?: string }
        Returns: {
          bio_length: number
          headline_length: number
        }[]
      }
      save_my_signup_location_v2: {
        Args: {
          p_accuracy_meters?: number
          p_captured_at?: string
          p_latitude?: number
          p_longitude?: number
          p_province_id: number
          p_source?: string
        }
        Returns: {
          location_saved: boolean
          nearby_enabled: boolean
          province_id: number
        }[]
      }
      save_my_signup_looking_for_v2: {
        Args: {
          p_lifestyle_tags: Database[\"public\"][\"Enums\"][\"profile_lifestyle_tag\"][]
          p_looking_for: string
        }
        Returns: {
          lifestyle_tag_count: number
          looking_for_length: number
        }[]
      }
"""
          replace_once('packages/supabase/src/database.types.ts', marker, generated + marker)

          # Remove the temporary generated-types filter; only server-only RPCs/tables stay filtered.
          p = Path('scripts/filter-internal-database-types.mjs')
          text = p.read_text()
          staged = """// Signup V2 is still an integration branch. Keep newly introduced staged RPCs
// on a runtime-validated structural client boundary until the final SU-11
// generated-types checkpoint, instead of granting this workflow write access.
const stagedRuntimeValidatedFunctions = [
  'save_my_signup_location_v2',
  'save_my_signup_looking_for_v2',
  'save_my_signup_headline_bio_v2',
];

"""
          if text.count(staged) != 1:
              raise SystemExit('filter script: staged RPC block did not match exactly once')
          text = text.replace(staged, '', 1)
          text = text.replace("removeGeneratedBlocks(stagedRuntimeValidatedFunctions, 'staged runtime-validated RPC');\n", '', 1)
          old_warn = "  `Filtered ${serverOnlyFunctions.length} server-only RPCs, ${stagedRuntimeValidatedFunctions.length} staged Signup V2 RPCs, ${serverOnlyTables.length} implementation table, plus profiles.public_profile_code from the client database contract.`,"
          new_warn = "  `Filtered ${serverOnlyFunctions.length} server-only RPCs, ${serverOnlyTables.length} implementation table, plus profiles.public_profile_code from the client database contract.`,"
          if text.count(old_warn) != 1:
              raise SystemExit('filter script: warning did not match exactly once')
          p.write_text(text.replace(old_warn, new_warn, 1))

          # Browser QA must assert the final Signup V2 copy, not the retired bridge copy.
          p = Path('tests/br-06/web-r02-final-ui-qa.spec.mjs')
          text = p.read_text()
          old = "Xác nhận thông tin cá nhân"
          count = text.count(old)
          if count < 1:
              raise SystemExit('web-r02: retired heading was not found')
          p.write_text(text.replace(old, 'Thông tin cá nhân'))

          # Release documentation: remove transitional bridge/boundary statements.
          docs_replacements = {
              'docs/SIGNUP-ONBOARDING-V2-LOCATION.md': [
                  ("Until SU-06/SU-07 replace the transitional profile bridge, Step 4 continues to `/onboarding/profile` after saving.", "After saving, Step 4 continues to the dedicated `/onboarding/looking-for` Signup V2 route."),
              ],
              'docs/SIGNUP-ONBOARDING-V2-LOOKING-FOR.md': [
                  ("Step 5 Continue currently moves to the transitional `/onboarding/profile` bridge; SU-07 will replace that bridge with the dedicated photo step.", "Step 5 Continue moves to the dedicated `/onboarding/photos` Signup V2 route."),
              ],
              'docs/SIGNUP-ONBOARDING-V2-BASELINE.md': [
                  ("integration baseline through SU-10.", "release baseline through SU-11."),
                  ("### Generated-types boundary during integration", "### Generated-types boundary after SU-11"),
                  ("`save_my_signup_location_v2`, `save_my_signup_looking_for_v2` and `save_my_signup_headline_bio_v2` remain on a structural/runtime-validated client boundary while this branch evolves. `activate_verified_signup_profile_v2` is service-role-only and filtered from the consumer generated contract. **SU-11 must perform the final generated-types checkpoint and remove the temporary staged-RPC filter before production release.** Workflow permissions remain `contents: read`.", "`save_my_signup_location_v2`, `save_my_signup_looking_for_v2` and `save_my_signup_headline_bio_v2` are part of the generated consumer database contract. The temporary structural casts/filter are removed. `activate_verified_signup_profile_v2` remains service-role-only and filtered from the consumer contract."),
              ],
          }
          for path, replacements in docs_replacements.items():
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
              p.write_text(text)

          # Hard release-cleanliness assertions.
          runtime_roots = [Path('apps/mobile'), Path('tests/br-06')]
          offenders = []
          for root in runtime_roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.ts', '.tsx', '.mjs', '.js'}:
                      text = path.read_text(errors='ignore')
                      if '/onboarding/profile' in text:
                          offenders.append(str(path))
          if offenders:
              raise SystemExit('retired /onboarding/profile references remain: ' + ', '.join(offenders))
          onboarding = Path('apps/mobile/src/lib/onboarding.ts').read_text()
          if ' as never' in onboarding or 'completeMinimumOnboarding' in onboarding:
              raise SystemExit('legacy/temporary onboarding client boundary remains')
          filter_text = Path('scripts/filter-internal-database-types.mjs').read_text()
          if 'stagedRuntimeValidatedFunctions' in filter_text:
              raise SystemExit('temporary staged RPC filter remains')
          PY

      - name: Commit SU-11 finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'apps/mobile/app/(auth)/index.tsx' \
            'apps/mobile/src/lib/onboarding.ts' \
            'packages/supabase/src/database.types.ts' \
            'scripts/filter-internal-database-types.mjs' \
            'tests/br-06/web-r02-final-ui-qa.spec.mjs' \
            'docs/SIGNUP-ONBOARDING-V2-LOCATION.md' \
            'docs/SIGNUP-ONBOARDING-V2-LOOKING-FOR.md' \
            'docs/SIGNUP-ONBOARDING-V2-BASELINE.md'
          git diff --cached --check
          git commit -m "fix(signup): finalize SU-11 release contract"
          git push origin HEAD:feature/signup-onboarding-v2
