name: BR-07 Fix Migration References

on:
  push:
    branches: ['agent/br-07-vietqr-reconciliation-mvp']
    paths:
      - '.github/workflows/br07-fix-migration-references.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Replace provisional migration version
        run: |
          set -euo pipefail
          old='20260801010100_br_07_vietqr_reconciliation_mvp'
          new='20260731185855_br_07_vietqr_reconciliation_mvp'
          sed -i "s/${old}/${new}/g" .github/workflows/database.yml scripts/validate-br07.mjs docs/br-07/STATUS.md
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/database.yml scripts/validate-br07.mjs docs/br-07/STATUS.md
          git commit -m 'Sync BR-07 migration references with hosted ledger'
          git push origin HEAD:${GITHUB_REF_NAME}
