name: SU-11 Finalizer PR

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/signup-onboarding-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/signup-onboarding-v2
          fetch-depth: 0

      - name: Apply SU-11 release cleanup
        shell: bash
        run: |
          python3 - <<'BOOT'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/su11-finalize.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'su11-finalize.py', 'exec'), {'__name__': '__main__'})
          BOOT

      - name: Commit SU-11 finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'apps/mobile/app/(auth)/index.tsx' \
            'apps/mobile/src/lib/onboarding.ts' \
            'packages/supabase/src/database.types.ts' \
            'scripts/filter-internal-database-types.mjs' \
            'tests/br-06/web-r02-final-ui-qa.spec.mjs' \
            'docs/SIGNUP-ONBOARDING-V2-LOCATION.md' \
            'docs/SIGNUP-ONBOARDING-V2-LOOKING-FOR.md' \
            'docs/SIGNUP-ONBOARDING-V2-BASELINE.md'
          git diff --cached --check
          git commit -m "fix(signup): finalize SU-11 release contract"
          git push origin HEAD:feature/signup-onboarding-v2
