name: SU-11 Finalizer PR

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feature/signup-onboarding-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/signup-onboarding-v2
          fetch-depth: 0

      - name: Normalize SU-11 generated database types
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/supabase/src/database.types.ts')
          text = path.read_text()
          start_marker = '      save_my_signup_headline_bio_v2: {\n'
          end_marker = '      save_my_signup_personal_info_v2: {\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = '''      save_my_signup_headline_bio_v2: {
        Args: { p_bio: string; p_headline?: string }
        Returns: {
          bio_length: number
          headline_length: number
        }[]
      }
      save_my_signup_location_v2: {
        Args: {
          p_accuracy_meters?: number
          p_captured_at?: string
          p_latitude?: number
          p_longitude?: number
          p_province_id: number
          p_source?: string
        }
        Returns: {
          location_saved: boolean
          nearby_enabled: boolean
          province_id: number
        }[]
      }
      save_my_signup_looking_for_v2: {
        Args: {
          p_lifestyle_tags: Database["public"]["Enums"]["profile_lifestyle_tag"][]
          p_looking_for: string
        }
        Returns: {
          lifestyle_tag_count: number
          looking_for_length: number
        }[]
      }
'''
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Commit generated-types normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/supabase/src/database.types.ts
          git diff --cached --check
          git commit -m "chore(signup): normalize SU-11 generated types"
          git push origin HEAD:feature/signup-onboarding-v2
