name: LX-14 test fixture patch (temporary)

on:
  push:
    branches:
      - agent/lx-14-private-photo-premium-gates
    paths:
      - .github/workflows/lx14-test-fixture-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lx-14-private-photo-premium-gates
          fetch-depth: 0
      - name: Fix approved media fixture timestamps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/tests/lx_13_member_profile_membership_presentation.sql')
          s=p.read_text()
          old="""  visibility,moderation_status,uploaded_at\n) values\n('23000000-0000-4000-8000-000000000101','23000000-0000-0000-0000-000000000002','profile-media','23000000-0000-0000-0000-000000000002/23000000-0000-4000-8000-000000000101/lx13-public.png','image','image/png',100,100,100,'public','pending_review',now()),\n('23000000-0000-4000-8000-000000000102','23000000-0000-0000-0000-000000000002','profile-media','23000000-0000-0000-0000-000000000002/23000000-0000-4000-8000-000000000102/lx13-private.png','image','image/png',100,100,100,'private','approved',now());"""
          new="""  visibility,moderation_status,uploaded_at,approved_at\n) values\n('23000000-0000-4000-8000-000000000101','23000000-0000-0000-0000-000000000002','profile-media','23000000-0000-0000-0000-000000000002/23000000-0000-4000-8000-000000000101/lx13-public.png','image','image/png',100,100,100,'public','approved',now(),now()),\n('23000000-0000-4000-8000-000000000102','23000000-0000-0000-0000-000000000002','profile-media','23000000-0000-0000-0000-000000000002/23000000-0000-4000-8000-000000000102/lx13-private.png','image','image/png',100,100,100,'private','approved',now(),now());"""
          if s.count(old)!=1:
            raise SystemExit('expected one LX-13 media fixture block')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fixture patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/lx_13_member_profile_membership_presentation.sql
          git commit -m 'LX-14: fix approved media lifecycle fixture'
          git push origin HEAD:agent/lx-14-private-photo-premium-gates
