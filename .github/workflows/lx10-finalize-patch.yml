name: LX-10 Finalize Patch

on:
  push:
    branches: ['agent/luxy-seeking-ui-foundation']
    paths:
      - '.github/workflows/lx10-finalize-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/luxy-seeking-ui-foundation
          fetch-depth: 0

      - name: Apply LX-10 compile and browser-login fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          search = Path('apps/mobile/src/components/luxy-search-desktop.tsx')
          text = search.read_text()
          old = "const activeSort = SORT_OPTIONS.find((item) => item.value === sort) ?? SORT_OPTIONS[0];"
          new = "const activeSort = SORT_OPTIONS.find((item) => item.value === sort) ?? SORT_OPTIONS[0]!;"
          if old not in text:
              raise SystemExit('activeSort patch target not found')
          search.write_text(text.replace(old, new, 1))

          desktop_test = Path('tests/br-06/luxy-desktop-shell.spec.mjs')
          text = desktop_test.read_text()
          old = "await expect(page.getByText('Khám phá', { exact: true }).first()).toBeVisible({ timeout: 30_000 });"
          new = "await expect(page.getByTestId('luxy-search-desktop')).toBeVisible({ timeout: 30_000 });"
          if old not in text:
              raise SystemExit('desktop shell login target not found')
          desktop_test.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/components/luxy-search-desktop.tsx tests/br-06/luxy-desktop-shell.spec.mjs
          git rm .github/workflows/lx10-finalize-patch.yml
          git commit -m 'LX-10 finalize desktop search compile and shell regression'
          git push origin HEAD:agent/luxy-seeking-ui-foundation
