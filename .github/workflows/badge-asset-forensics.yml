name: Badge asset forensic bundle

on:
  push:
    branches: ['agent/fix-membership-badge-rendering']
    paths:
      - '.github/workflows/badge-asset-forensics.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: membership-badge-assets
          path: |
            apps/mobile/assets/luxy/premium-badge.png
            apps/mobile/assets/luxy/diamond-badge.png
            apps/mobile/assets/luxy/premium-badge-hq.png
            apps/mobile/assets/luxy/diamond-badge-hq.png
          if-no-files-found: error
          retention-days: 1
