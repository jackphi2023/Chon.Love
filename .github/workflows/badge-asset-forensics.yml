name: Repair membership badge assets

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/badge-asset-forensics.yml'
      - 'scripts/rebuild-membership-badges.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild valid 16:11 badge PNGs
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python scripts/rebuild-membership-badges.py
      - name: Commit repaired raster assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/assets/luxy/premium-badge-hq.png apps/mobile/assets/luxy/diamond-badge-hq.png
          if git diff --cached --quiet; then
            echo 'Assets already match the deterministic repair.'
            exit 0
          fi
          git commit -m 'Repair Premium and Diamond badge raster assets'
          git push origin HEAD:${{ github.head_ref }}
