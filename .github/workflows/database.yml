name: Database

on:
  push:
    branches: [develop, 'feature/phase-b-database-security']
    paths: ['supabase/**','packages/supabase/**','docs/phase-b/**','.github/workflows/database.yml','package.json']
  pull_request:
    paths: ['supabase/**','packages/supabase/**','docs/phase-b/**','.github/workflows/database.yml','package.json']

permissions:
  contents: write
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - name: Verify CLI and migration inventory
        run: |
          supabase --version
          supabase migration --help >/dev/null
          supabase db --help >/dev/null
          test -f supabase/migrations/20260729160331_phase_b_06_core_profiles.sql
          test -f supabase/migrations/20260729160609_phase_b_06_fix_onboarding_rpc.sql
          test -f supabase/migrations/20260729160726_phase_b_06_add_fk_indexes.sql
          test -f supabase/migrations/20260729170755_phase_b_07_social_location_messaging.sql
          test -f supabase/migrations/20260729170804_phase_b_07_policy_helper_permission.sql
          test -f supabase/migrations/20260729171149_phase_b_07_add_last_read_index.sql
          test -f supabase/migrations/20260729182255_phase_b_08_media_schema.sql
          test -f supabase/migrations/20260729182445_phase_b_08_media_access_policies.sql
          test -f supabase/migrations/20260729182509_phase_b_08_media_hardening.sql
          test -f supabase/migrations/20260729183126_phase_b_08_add_fk_indexes.sql
          test -f supabase/migrations/20260729195413_phase_b_09_catalog_purchase_heart_schema.sql
          test -f supabase/migrations/20260729195524_phase_b_09_gifts_rewards_fan_schema.sql
          test -f supabase/migrations/20260729195622_phase_b_09_economy_purchase_operations.sql
          test -f supabase/migrations/20260729195731_phase_b_09_gift_reward_operations.sql
          test -f supabase/migrations/20260729195833_phase_b_09_reversal_access_policies.sql
          test -f supabase/migrations/20260729200109_phase_b_09_add_fk_indexes.sql
          test -f supabase/migrations/20260729200855_phase_b_09_edge_function_marker.sql
          test -f supabase/migrations/20260729200911_phase_b_09_edge_function_marker.sql
          test -f supabase/migrations/20260729200945_phase_b_09_noop_history_alignment.sql
          test -f supabase/migrations/20260729201435_phase_b_09_add_liability_gift_index.sql
          test -f supabase/migrations/20260729204001_phase_b_10_kyc_withdrawal_schema.sql || test -f supabase/migrations/20260729220856_phase_b_10_kyc_withdrawal_schema.sql
          test -f supabase/migrations/20260729204002_phase_b_10_kyc_bank_user_operations.sql || test -f supabase/migrations/20260729221145_phase_b_10_kyc_bank_user_operations.sql
          test -f supabase/migrations/20260729204003_phase_b_10_withdrawal_request_operations.sql || test -f supabase/migrations/20260729221229_phase_b_10_withdrawal_request_operations.sql
          test -f supabase/migrations/20260729204004_phase_b_10_kyc_bank_review_operations.sql || test -f supabase/migrations/20260729221301_phase_b_10_kyc_bank_review_operations.sql
          test -f supabase/migrations/20260729204005_phase_b_10_withdrawal_admin_operations.sql || test -f supabase/migrations/20260729221338_phase_b_10_withdrawal_admin_operations.sql
          test -f supabase/migrations/20260729204006_phase_b_10_account_hold_operations.sql || test -f supabase/migrations/20260729221404_phase_b_10_account_hold_operations.sql
          test -f supabase/migrations/20260729204007_phase_b_10_account_deletion_operations.sql || test -f supabase/migrations/20260729221447_phase_b_10_account_deletion_operations.sql
          test -f supabase/migrations/20260729204008_phase_b_10_access_sync_admin_payloads.sql || test -f supabase/migrations/20260729221523_phase_b_10_access_sync_admin_payloads.sql
          test -f supabase/migrations/20260729204009_phase_b_10_fix_kyc_submit_ambiguity.sql || test -f supabase/migrations/20260729221539_phase_b_10_fix_kyc_submit_ambiguity.sql
          test -f supabase/migrations/20260729204010_phase_b_10_fix_kyc_review_ambiguity.sql || test -f supabase/migrations/20260729221549_phase_b_10_fix_kyc_review_ambiguity.sql
          test -f supabase/migrations/20260729204011_phase_b_10_fix_withdrawal_request_ambiguity.sql || test -f supabase/migrations/20260729221601_phase_b_10_fix_withdrawal_request_ambiguity.sql
          test -f supabase/migrations/20260729204012_phase_b_10_fix_withdrawal_admin_ambiguity.sql || test -f supabase/migrations/20260729221613_phase_b_10_fix_withdrawal_admin_ambiguity.sql
          test -f supabase/migrations/20260729204013_phase_b_10_fix_kyc_document_access_ambiguity.sql || test -f supabase/migrations/20260729221624_phase_b_10_fix_kyc_document_access_ambiguity.sql
          test -f supabase/migrations/20260729204014_phase_b_10_fix_deletion_admin_ambiguity.sql || test -f supabase/migrations/20260729221637_phase_b_10_fix_deletion_admin_ambiguity.sql
          test -f supabase/functions/media-access/index.ts
          test -f supabase/functions/media-moderation/index.ts
          test -f supabase/functions/play-purchase-verify/index.ts
          test -f supabase/functions/payout-profile-submit/index.ts
          test -f supabase/functions/payout-profile-submit/crypto.ts
          test -f supabase/functions/payout-admin/index.ts
          test -f supabase/functions/payout-admin/crypto.ts
          test -f supabase/functions/account-deletion/index.ts
          test -f supabase/tests/10_kyc_withdrawals_audit_test.sql
          test -f supabase/tests/10_withdrawal_concurrency.sh
      - name: Start local Supabase
        run: supabase start
      - name: Reset and seed
        run: supabase db reset --local
      - name: Run pgTAP tests
        run: supabase test db --local
      - name: Run Session 9 concurrent gift test
        run: bash supabase/tests/09_concurrency.sh
      - name: Run Session 10 concurrent withdrawal test
        run: bash supabase/tests/10_withdrawal_concurrency.sh
      - name: Lint schemas
        run: supabase db lint --local --schema public --schema private --level warning
      - name: Generate and verify public contract
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          grep -q 'payout_sync' /tmp/database.types.ts
          grep -q 'get_my_payout_summary' /tmp/database.types.ts
          grep -q 'get_my_kyc_status' /tmp/database.types.ts
          grep -q 'request_withdrawal' /tmp/database.types.ts
          grep -q 'request_account_deletion' /tmp/database.types.ts
          grep -q 'server_submit_kyc_profile' /tmp/database.types.ts
          ! grep -q '^      kyc_profiles:' /tmp/database.types.ts
          ! grep -q '^      bank_accounts:' /tmp/database.types.ts
          ! grep -q '^      withdrawals:' /tmp/database.types.ts
          ! grep -q '^      admin_audit_logs:' /tmp/database.types.ts
      - name: Verify exact generated types
        run: cmp --silent /tmp/database.types.ts packages/supabase/src/database.types.ts
      - name: Verify application TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Align Session 10 migration history
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/phase-b-database-security'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          branch="feature/phase-b-database-security"
          head_sha=$(gh api "repos/$repo/git/ref/heads/$branch" --jq .object.sha)
          base_tree=$(gh api "repos/$repo/git/commits/$head_sha" --jq .tree.sha)
          entries=$(mktemp)
          echo '[]' > "$entries"
          changed=0
          add_entry() {
            local path="$1" sha="$2"
            jq --arg path "$path" --arg sha "$sha" '. + [{path:$path,mode:"100644",type:"blob",sha:$sha}]' "$entries" > "$entries.tmp"
            mv "$entries.tmp" "$entries"
          }
          delete_entry() {
            local path="$1"
            jq --arg path "$path" '. + [{path:$path,mode:"100644",type:"blob",sha:null}]' "$entries" > "$entries.tmp"
            mv "$entries.tmp" "$entries"
          }
          while read -r old new; do
            [ -z "$old" ] && continue
            if gh api "repos/$repo/contents/$old?ref=$branch" > /tmp/old.json 2>/dev/null; then
              blob=$(jq -r .sha /tmp/old.json)
              add_entry "$new" "$blob"
              delete_entry "$old"
              changed=1
            fi
          done <<'MAPPINGS'
          supabase/migrations/20260729204001_phase_b_10_kyc_withdrawal_schema.sql supabase/migrations/20260729220856_phase_b_10_kyc_withdrawal_schema.sql
          supabase/migrations/20260729204002_phase_b_10_kyc_bank_user_operations.sql supabase/migrations/20260729221145_phase_b_10_kyc_bank_user_operations.sql
          supabase/migrations/20260729204003_phase_b_10_withdrawal_request_operations.sql supabase/migrations/20260729221229_phase_b_10_withdrawal_request_operations.sql
          supabase/migrations/20260729204004_phase_b_10_kyc_bank_review_operations.sql supabase/migrations/20260729221301_phase_b_10_kyc_bank_review_operations.sql
          supabase/migrations/20260729204005_phase_b_10_withdrawal_admin_operations.sql supabase/migrations/20260729221338_phase_b_10_withdrawal_admin_operations.sql
          supabase/migrations/20260729204006_phase_b_10_account_hold_operations.sql supabase/migrations/20260729221404_phase_b_10_account_hold_operations.sql
          supabase/migrations/20260729204007_phase_b_10_account_deletion_operations.sql supabase/migrations/20260729221447_phase_b_10_account_deletion_operations.sql
          supabase/migrations/20260729204008_phase_b_10_access_sync_admin_payloads.sql supabase/migrations/20260729221523_phase_b_10_access_sync_admin_payloads.sql
          supabase/migrations/20260729204009_phase_b_10_fix_kyc_submit_ambiguity.sql supabase/migrations/20260729221539_phase_b_10_fix_kyc_submit_ambiguity.sql
          supabase/migrations/20260729204010_phase_b_10_fix_kyc_review_ambiguity.sql supabase/migrations/20260729221549_phase_b_10_fix_kyc_review_ambiguity.sql
          supabase/migrations/20260729204011_phase_b_10_fix_withdrawal_request_ambiguity.sql supabase/migrations/20260729221601_phase_b_10_fix_withdrawal_request_ambiguity.sql
          supabase/migrations/20260729204012_phase_b_10_fix_withdrawal_admin_ambiguity.sql supabase/migrations/20260729221613_phase_b_10_fix_withdrawal_admin_ambiguity.sql
          supabase/migrations/20260729204013_phase_b_10_fix_kyc_document_access_ambiguity.sql supabase/migrations/20260729221624_phase_b_10_fix_kyc_document_access_ambiguity.sql
          supabase/migrations/20260729204014_phase_b_10_fix_deletion_admin_ambiguity.sql supabase/migrations/20260729221637_phase_b_10_fix_deletion_admin_ambiguity.sql
          MAPPINGS
          for marker in \
            supabase/migrations/20260729221738_phase_b_10_fix_kyc_submit_ambiguity.sql \
            supabase/migrations/20260729221806_phase_b_10_remote_history_alignment.sql; do
            if ! gh api "repos/$repo/contents/$marker?ref=$branch" >/dev/null 2>&1; then
              content="-- Remote migration-history alignment marker. No schema change."
              blob=$(gh api --method POST "repos/$repo/git/blobs" -f content="$content" -f encoding="utf-8" --jq .sha)
              add_entry "$marker" "$blob"
              changed=1
            fi
          done
          if [ "$changed" -eq 1 ]; then
            tree_sha=$(jq -n --arg base "$base_tree" --slurpfile tree "$entries" '{base_tree:$base,tree:$tree[0]}' | gh api --method POST "repos/$repo/git/trees" --input - --jq .sha)
            commit_sha=$(jq -n --arg message 'chore: align Session 10 remote migration history' --arg tree "$tree_sha" --arg parent "$head_sha" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/$repo/git/commits" --input - --jq .sha)
            gh api --method PATCH "repos/$repo/git/refs/heads/$branch" -f sha="$commit_sha" -F force=false
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
