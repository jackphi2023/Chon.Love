name: Database

on:
  push:
    branches: [develop, 'feature/phase-b-database-security']
    paths: ['supabase/**','packages/supabase/**','docs/phase-b/**','.github/workflows/database.yml','package.json']
  pull_request:
    paths: ['supabase/**','packages/supabase/**','docs/phase-b/**','.github/workflows/database.yml','package.json']

permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
      - name: Verify CLI and migration inventory
        run: |
          supabase --version
          supabase migration --help >/dev/null
          supabase db --help >/dev/null
          test -f supabase/migrations/20260729160331_phase_b_06_core_profiles.sql
          test -f supabase/migrations/20260729160609_phase_b_06_fix_onboarding_rpc.sql
          test -f supabase/migrations/20260729160726_phase_b_06_add_fk_indexes.sql
          test -f supabase/migrations/20260729170755_phase_b_07_social_location_messaging.sql
          test -f supabase/migrations/20260729170804_phase_b_07_policy_helper_permission.sql
          test -f supabase/migrations/20260729171149_phase_b_07_add_last_read_index.sql
          test -f supabase/migrations/20260729182255_phase_b_08_media_schema.sql
          test -f supabase/migrations/20260729182445_phase_b_08_media_access_policies.sql
          test -f supabase/migrations/20260729182509_phase_b_08_media_hardening.sql
          test -f supabase/migrations/20260729183126_phase_b_08_add_fk_indexes.sql
          test -f supabase/migrations/20260729190000_phase_b_09_catalog_purchase_heart_schema.sql
          test -f supabase/migrations/20260729190010_phase_b_09_gifts_rewards_fan_schema.sql
          test -f supabase/migrations/20260729190020_phase_b_09_economy_purchase_operations.sql
          test -f supabase/migrations/20260729190030_phase_b_09_gift_reward_operations.sql
          test -f supabase/migrations/20260729190040_phase_b_09_reversal_access_policies.sql
          test -f supabase/functions/media-access/index.ts
          test -f supabase/functions/media-moderation/index.ts
          test -f supabase/functions/play-purchase-verify/index.ts
      - name: Start local Supabase
        run: supabase start
      - name: Reset and seed
        run: supabase db reset --local
      - name: Run pgTAP tests
        run: supabase test db --local
      - name: Run Session 9 concurrent gift test
        run: bash supabase/tests/09_concurrency.sh
      - name: Lint schemas
        run: supabase db lint --local --schema public --schema private --level warning
      - name: Verify generated public contract
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          grep -q 'administrative_areas' /tmp/database.types.ts
          grep -q 'media_assets' /tmp/database.types.ts
          grep -q 'heart_products' /tmp/database.types.ts
          grep -q 'gift_catalog' /tmp/database.types.ts
          grep -q 'gift_transactions' /tmp/database.types.ts
          grep -q 'fan_memberships' /tmp/database.types.ts
          grep -q 'send_gift' /tmp/database.types.ts
          grep -q 'get_my_economy_summary' /tmp/database.types.ts
          ! grep -q 'user_identity' /tmp/database.types.ts
          ! grep -q 'user_locations' /tmp/database.types.ts
          ! grep -q 'media_moderation_events' /tmp/database.types.ts
          ! grep -q 'play_purchases' /tmp/database.types.ts
          ! grep -q 'heart_ledger' /tmp/database.types.ts
          ! grep -q 'creator_reward_ledger' /tmp/database.types.ts
      - name: Verify application TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
