name: Database

on:
  push:
    branches: [main, develop, 'feature/**', 'agent/**', 'release/**', 'hotfix/**']
    paths:
      - 'supabase/**'
      - 'packages/supabase/**'
      - 'apps/admin/**'
      - 'scripts/validate-br01.mjs'
      - 'scripts/validate-br03.mjs'
      - 'scripts/validate-br04.mjs'
      - 'scripts/validate-br06.mjs'
      - 'scripts/validate-br07.mjs'
      - 'scripts/validate-br08.mjs'
      - 'scripts/validate-br09.mjs'
      - 'scripts/filter-internal-database-types.mjs'
      - 'scripts/br06/**'
      - 'tests/br-06/**'
      - 'playwright.br06.config.mjs'
      - 'docs/br-01/**'
      - 'docs/br-03/**'
      - 'docs/br-04/**'
      - 'docs/br-06/**'
      - 'docs/br-07/**'
      - 'docs/br-08/**'
      - 'docs/br-09/**'
      - '.github/workflows/database.yml'
      - '.github/workflows/browser-e2e.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'supabase/**'
      - 'packages/supabase/**'
      - 'apps/admin/**'
      - 'scripts/validate-br01.mjs'
      - 'scripts/validate-br03.mjs'
      - 'scripts/validate-br04.mjs'
      - 'scripts/validate-br06.mjs'
      - 'scripts/validate-br07.mjs'
      - 'scripts/validate-br08.mjs'
      - 'scripts/validate-br09.mjs'
      - 'scripts/filter-internal-database-types.mjs'
      - 'scripts/br06/**'
      - 'tests/br-06/**'
      - 'playwright.br06.config.mjs'
      - 'docs/br-01/**'
      - 'docs/br-03/**'
      - 'docs/br-04/**'
      - 'docs/br-06/**'
      - 'docs/br-07/**'
      - 'docs/br-08/**'
      - 'docs/br-09/**'
      - '.github/workflows/database.yml'
      - '.github/workflows/browser-e2e.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Verify source-of-truth migration inventory
        run: |
          supabase --version
          test -f supabase/migrations/20260731100320_seed_16_beta_users_support.sql
          test -f supabase/migrations/20260731100850_enable_pg_net_for_seed_transport.sql
          test -f supabase/migrations/20260731100951_temporary_seed_asset_transport.sql
          test -f supabase/migrations/20260731101606_temporary_seed_image_transport.sql
          test -f supabase/migrations/20260731103048_temporary_seed_user_manifest.sql
          test -f supabase/migrations/20260731103426_temporary_seed_request_helper.sql
          test -f supabase/migrations/20260731103608_cleanup_one_time_beta_seed_transport.sql
          test -f supabase/migrations/20260731114823_br_01_explicit_rpc_only_deny_policies.sql
          test -f supabase/migrations/20260731125443_br_01_function_lint_reconciliation.sql
          test -f supabase/migrations/20260731134111_br_03_beta_auth_rotation_and_session_controls.sql
          test -f supabase/migrations/20260731134449_br_03_beta_fixed_credentials_exception.sql
          test -f supabase/migrations/20260731134617_br_03_remove_rotation_scaffolding.sql
          test -f supabase/migrations/20260731172253_br_06_storage_policy_helper_execution.sql
          test -f supabase/migrations/20260731185855_br_07_vietqr_reconciliation_mvp.sql
          test -f supabase/migrations/20260731205924_br_08_kyc_withdrawal_operational_flow.sql
          test -f supabase/migrations/20260801045034_br_09_runtime_observability_resilience.sql
          test -f supabase/migrations/20260811130000_lx_07_profile_schema.sql
          test -f supabase/migrations/20260811161500_lx_09_search_backend_v2.sql
          test -f supabase/migrations/20260812094000_lx_13_member_profile_membership_presentation.sql
          test -f supabase/migrations/20260812121500_lx_14_private_photo_premium_interactions.sql
          test -f supabase/migrations/20260816101657_chon_policy_reaccept_preserve_verified_identity.sql
          test -f supabase/migrations/20260816101704_chon_runtime_legacy_retirement.sql
          test -f supabase/migrations/20260816121228_chon_existing_user_access_and_badges.sql
          test -f supabase/migrations/20260816153138_chon_profile_media_delivery_integrity.sql
          test -f supabase/migrations/20260816154812_chon_public_media_approval_scope_private_compatibility.sql
          test -f supabase/migrations/20260820095000_su_03_signup_personal_info_contract.sql
          test -f supabase/migrations/20260820112500_su_05_signup_location_contract.sql
          test -f supabase/migrations/20260820113500_su_06_signup_looking_for_contract.sql
          test -f supabase/migrations/20260820124000_su_08_signup_headline_bio_contract.sql
          test -f supabase/migrations/20260820132500_su_09_selfie_completion_activation.sql
          test -f supabase/migrations/20260824223000_ui_msg02_deleted_message_contract.sql
          test -f supabase/migrations/20260827143000_opt_01_approval_contract.sql
          test -f supabase/migrations/20260827144500_opt_01_retire_legacy_discovery_rpc.sql
          test -f supabase/migrations/20260827150000_opt_02_media_moderation_integrity.sql
          test -f supabase/migrations/20260827162000_opt_03_admin_review_queue.sql
          test -f supabase/migrations/20260827234000_opt_05_profile_edit_date_of_birth.sql
          test -f supabase/functions/seed-myfan-beta-users/index.ts
          test -f supabase/functions/reset-myfan-beta-passwords/index.ts
          test -f supabase/functions/vietqr-reconciliation-admin/index.ts
          test -f supabase/functions/payout-admin/index.ts
          test -f supabase/functions/runtime-observability-admin/index.ts
          test -f supabase/tests/br_01_security_reconciliation.sql
          test -f supabase/tests/br_03_auth_session_reconciliation.sql
          test -f supabase/tests/br_04_core_social_multi_account_e2e.sql
          test -f supabase/tests/br_06_storage_policy_helper_acl.sql
          test -f supabase/tests/br_07_vietqr_reconciliation_mvp.sql
          test -f supabase/tests/br_08_kyc_withdrawal_operational_flow.sql
          test -f supabase/tests/br_09_runtime_observability_resilience.sql
          test -f supabase/tests/lx_07_profile_schema.sql
          test -f supabase/tests/lx_09_search_backend_v2.sql
          test -f supabase/tests/lx_13_member_profile_membership_presentation.sql
          test -f supabase/tests/lx_14_private_photo_premium_entitlements.sql
          test -f supabase/tests/chon_policy_reaccept_preserve_verified_identity.sql
          test -f supabase/tests/chon_runtime_legacy_retirement.sql
          test -f supabase/tests/chon_profile_media_delivery.sql
          test -f supabase/tests/su_03_signup_personal_info_contract.sql
          test -f supabase/tests/su_05_signup_location_contract.sql
          test -f supabase/tests/su_06_signup_looking_for_contract.sql
          test -f supabase/tests/su_08_signup_headline_bio_contract.sql
          test -f supabase/tests/su_09_selfie_completion_activation.sql
          test -f supabase/tests/ui_msg02_deleted_message_contract.sql
          test -f supabase/tests/opt_01_approval_contract.sql
          test -f supabase/tests/opt_02_media_moderation_integrity.sql
          test -f supabase/tests/opt_03_admin_review.sql
          test -f supabase/tests/opt_04_member_visibility.sql
          test -f supabase/tests/opt_05_profile_edit.sql
          test -f scripts/validate-br06.mjs
          test -f scripts/validate-br07.mjs
          test -f scripts/validate-br08.mjs
          test -f scripts/validate-br09.mjs
          test -f scripts/filter-internal-database-types.mjs
          test -f tests/br-06/mobile-web-multi-account.spec.mjs
          test -f tests/br-06/luxy-member-profile.spec.mjs

      - name: Start local Supabase
        run: supabase start

      - name: Clean reset from repository migrations
        run: supabase db reset --local

      - name: Run BR-01 security reconciliation contract
        run: supabase test db supabase/tests/br_01_security_reconciliation.sql --local

      - name: Run BR-03 auth session reconciliation contract
        run: supabase test db supabase/tests/br_03_auth_session_reconciliation.sql --local

      - name: Run BR-04 core social multi-account contract
        run: supabase test db supabase/tests/br_04_core_social_multi_account_e2e.sql --local

      - name: Run BR-06 Storage policy helper ACL contract
        run: supabase test db supabase/tests/br_06_storage_policy_helper_acl.sql --local

      - name: Run BR-07 VietQR reconciliation MVP
        run: supabase test db supabase/tests/br_07_vietqr_reconciliation_mvp.sql --local

      - name: Run BR-08 KYC and withdrawal operational flow
        run: supabase test db supabase/tests/br_08_kyc_withdrawal_operational_flow.sql --local

      - name: Run BR-09 runtime observability resilience
        run: supabase test db supabase/tests/br_09_runtime_observability_resilience.sql --local

      - name: Run LX-07 profile schema contract
        run: supabase test db supabase/tests/lx_07_profile_schema.sql --local

      - name: Run LX-09 Search Backend V2 contract
        run: supabase test db supabase/tests/lx_09_search_backend_v2.sql --local

      - name: Run LX-13 Member Profile membership presentation contract
        run: supabase test db supabase/tests/lx_13_member_profile_membership_presentation.sql --local

      - name: Run LX-14 Private Photo and Premium interaction contract
        run: supabase test db supabase/tests/lx_14_private_photo_premium_entitlements.sql --local

      - name: Run Chon.Love existing-user policy re-acceptance contract
        run: supabase test db supabase/tests/chon_policy_reaccept_preserve_verified_identity.sql --local

      - name: Run Chon.Love retired runtime grant contract
        run: supabase test db supabase/tests/chon_runtime_legacy_retirement.sql --local

      - name: Run Chon.Love profile media delivery contract
        run: supabase test db supabase/tests/chon_profile_media_delivery.sql --local

      - name: Run SU-03 Signup personal info contract
        run: supabase test db supabase/tests/su_03_signup_personal_info_contract.sql --local

      - name: Run SU-05 Signup location contract
        run: supabase test db supabase/tests/su_05_signup_location_contract.sql --local

      - name: Run SU-06 Signup looking-for contract
        run: supabase test db supabase/tests/su_06_signup_looking_for_contract.sql --local

      - name: Run SU-08 Signup headline/bio contract
        run: supabase test db supabase/tests/su_08_signup_headline_bio_contract.sql --local

      - name: Run SU-09 Selfie completion activation contract
        run: supabase test db supabase/tests/su_09_selfie_completion_activation.sql --local

      - name: Run OPT-01 approval contract
        run: supabase test db supabase/tests/opt_01_approval_contract.sql --local

      - name: Run OPT-02 media moderation integrity contract
        run: supabase test db supabase/tests/opt_02_media_moderation_integrity.sql --local

      - name: Run OPT-03 Admin review contract
        run: supabase test db supabase/tests/opt_03_admin_review.sql --local

      - name: Run OPT-04 member visibility contract
        run: supabase test db supabase/tests/opt_04_member_visibility.sql --local

      - name: Run OPT-05 profile edit contract
        run: supabase test db supabase/tests/opt_05_profile_edit.sql --local

      - name: Run UI-MSG02 deleted-message retention contract
        run: supabase test db supabase/tests/ui_msg02_deleted_message_contract.sql --local

      - name: Run concurrent gift ledger test
        run: bash supabase/tests/09_concurrency.sh

      - name: Run concurrent withdrawal ledger test
        run: bash supabase/tests/10_withdrawal_concurrency.sh

      - name: Lint schemas
        run: |
          supabase db lint --local --schema public --schema private --level warning | tee /tmp/database-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path('/tmp/database-lint.json').read_text().strip()
          findings = json.loads(raw) if raw else []
          errors = [
              (item.get('function'), issue.get('message'))
              for item in findings
              for issue in item.get('issues', [])
              if issue.get('level') == 'error'
          ]
          if errors:
              for function, message in errors:
                  print(f'ERROR {function}: {message}')
              raise SystemExit(1)
          print(f'Schema lint: zero errors; {len(findings)} warning entries retained for cleanup.')
          PY

      - name: Generate public database contract
        run: |
          for attempt in 1 2 3; do
            if supabase gen types typescript --local --schema public > /tmp/database.types.attempt.ts; then
              mv /tmp/database.types.attempt.ts /tmp/database.types.ts
              exit 0
            fi
            echo "Type generation attempt ${attempt} failed; retrying after registry backoff." >&2
            rm -f /tmp/database.types.attempt.ts
            sleep $((attempt * 10))
          done
          exit 1

      - name: Remove service-role-only Admin RPCs from client contract
        run: node scripts/filter-internal-database-types.mjs /tmp/database.types.ts

      - name: Upload generated public contract
        uses: actions/upload-artifact@v4
        with:
          name: chon-database-types
          path: /tmp/database.types.ts
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated public contract
        run: cmp --silent /tmp/database.types.ts packages/supabase/src/database.types.ts

      - name: Stop local Supabase before workspace checks
        run: supabase stop --no-backup

      - name: Verify application workspace
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm install --frozen-lockfile
          pnpm validate
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
