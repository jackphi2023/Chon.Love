name: Temporary public profile media URL codemod

on:
  push:
    branches: [agent/chon-profile-media-delivery-fix]
    paths:
      - '.github/workflows/chon-profile-media-public-url-codemod-temp.yml'

permissions:
  contents: write

jobs:
  patch-public-profile-media-callers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/chon-profile-media-delivery-fix
          fetch-depth: 0

      - name: Switch public profile surfaces to the public URL helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              Path('apps/mobile/src/components/luxy-search-desktop.tsx'): 1,
              Path('apps/mobile/src/components/luxy-search-mobile.tsx'): 1,
              Path('apps/mobile/app/profile/[username].tsx'): 2,
          }

          for path, expected_calls in targets.items():
              text = path.read_text()
              import_count = text.count('createPrivateMediaUrl,')
              call_count = text.count('createPrivateMediaUrl(')
              if import_count != 1 or call_count != expected_calls:
                  raise SystemExit(
                      f'{path}: expected one import and {expected_calls} calls, '
                      f'found imports={import_count}, calls={call_count}'
                  )
              text = text.replace('createPrivateMediaUrl,', 'createPublicProfileMediaUrl,')
              text = text.replace('createPrivateMediaUrl(', 'createPublicProfileMediaUrl(')
              path.write_text(text)
              print(f'patched {path}: {expected_calls} public media calls')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/components/luxy-search-desktop.tsx apps/mobile/src/components/luxy-search-mobile.tsx 'apps/mobile/app/profile/[username].tsx'
          git commit -m 'fix: use long-lived URLs for public profile photos'
          git push origin HEAD:agent/chon-profile-media-delivery-fix
