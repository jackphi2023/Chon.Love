name: WEB-R03 Final Audit

on:
  push:
    branches:
      - release/luxy-web-v1
    paths:
      - .github/workflows/web-r03-final-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish final Search activity wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('apps/mobile/src/components/luxy-search-mobile.tsx'),
              Path('apps/mobile/src/components/luxy-search-desktop.tsx'),
          ]:
              text = path.read_text(encoding='utf-8')
              if 'Hoạt động gần đây' not in text:
                  raise SystemExit(f'missing Search sort wording in {path}')
              path.write_text(text.replace('Hoạt động gần đây', 'Truy cập gần đây'), encoding='utf-8')
          PY
      - name: Permanent branding guard
        run: node scripts/validate-web-r03-branding.mjs
      - name: Validate and commit polish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/src/components/luxy-search-mobile.tsx apps/mobile/src/components/luxy-search-desktop.tsx
          git commit -m 'fix(web-r03): use neutral recent-access wording'
          git push origin HEAD:release/luxy-web-v1
