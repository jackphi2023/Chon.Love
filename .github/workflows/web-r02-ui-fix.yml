name: WEB-R02 UI Fix

on:
  push:
    branches: ['release/luxy-web-v1']
    paths: ['.github/workflows/web-r02-ui-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/luxy-web-v1

      - name: Patch WEB-R02 accessibility defects
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile_path = Path('apps/mobile/app/profile/[username].tsx')
          profile = profile_path.read_text()
          old = '''          <Pressable
            accessibilityLabel={`Xem ảnh đại diện của ${displayName}`}
            accessibilityRole="button"
            disabled={!avatarQuery.data}
            onPress={() => openPhoto(avatarQuery.data ?? null)}
            style={({ pressed }) => [styles.heroPhotoFrame, pressed && styles.pressed]}
            testID="luxy-member-profile-hero-photo"
          >
            {avatarQuery.data ? (
              <Image accessibilityLabel={`Ảnh đại diện của ${displayName}`} resizeMode="cover" source={{ uri: avatarQuery.data }} style={styles.heroPhoto} />
            ) : (
              <View style={styles.heroFallback}><Text style={styles.heroFallbackText}>{displayName.slice(0, 1).toUpperCase()}</Text></View>
            )}
            {profile.membership_badge_visible ? (
              <LuxyMembershipBadgeImage tier={profile.membership_tier} width={112} inset={10} />
            ) : null}
            {!profile.blocked_by_viewer ? (
              <View style={styles.heroFavorite}>
                <LuxyFavoriteButton
                  initialFavorited={favoriteState?.is_favorited ?? false}
                  initialFavoritedBy={favoriteState?.is_favorited_by ?? false}
                  name={displayName}
                  profileId={profile.id}
                />
              </View>
            ) : null}
          </Pressable>'''
          new = '''          <View style={styles.heroPhotoFrame} testID="luxy-member-profile-hero-photo">
            <Pressable
              accessibilityLabel={`Xem ảnh đại diện của ${displayName}`}
              accessibilityRole="button"
              disabled={!avatarQuery.data}
              onPress={() => openPhoto(avatarQuery.data ?? null)}
              style={({ pressed }) => [styles.heroPhotoPressTarget, pressed && styles.pressed]}
            >
              {avatarQuery.data ? (
                <Image accessibilityLabel={`Ảnh đại diện của ${displayName}`} resizeMode="cover" source={{ uri: avatarQuery.data }} style={styles.heroPhoto} />
              ) : (
                <View style={styles.heroFallback}><Text style={styles.heroFallbackText}>{displayName.slice(0, 1).toUpperCase()}</Text></View>
              )}
            </Pressable>
            {profile.membership_badge_visible ? (
              <LuxyMembershipBadgeImage tier={profile.membership_tier} width={112} inset={10} />
            ) : null}
            {!profile.blocked_by_viewer ? (
              <View style={styles.heroFavorite}>
                <LuxyFavoriteButton
                  initialFavorited={favoriteState?.is_favorited ?? false}
                  initialFavoritedBy={favoriteState?.is_favorited_by ?? false}
                  name={displayName}
                  profileId={profile.id}
                />
              </View>
            ) : null}
          </View>'''
          if old not in profile:
              raise SystemExit('member profile hero block not found')
          profile = profile.replace(old, new, 1)
          style_old = "  heroPhotoFrame: { aspectRatio: 0.72, backgroundColor: '#E7E5E4', borderRadius: 14, overflow: 'hidden', position: 'relative', width: '100%' }, heroPhoto:"
          style_new = "  heroPhotoFrame: { aspectRatio: 0.72, backgroundColor: '#E7E5E4', borderRadius: 14, overflow: 'hidden', position: 'relative', width: '100%' }, heroPhotoPressTarget: { height: '100%', width: '100%' }, heroPhoto:"
          if style_old not in profile:
              raise SystemExit('member profile hero style not found')
          profile_path.write_text(profile.replace(style_old, style_new, 1))

          onboarding_path = Path('apps/mobile/app/onboarding/profile.tsx')
          onboarding = onboarding_path.read_text()
          replacements = [
              (
                  '<Pressable key={item.value} onPress={() => setGender(item.value)} style={[styles.chip, gender === item.value && styles.active]}>',
                  '<Pressable accessibilityRole="radio" accessibilityState={{ checked: gender === item.value }} key={item.value} onPress={() => setGender(item.value)} style={[styles.chip, gender === item.value && styles.active]}>'
              ),
              (
                  '<Pressable key={item.id} onPress={() => setProvinceId(item.id)} style={[styles.chip, provinceId === item.id && styles.active]}>',
                  '<Pressable accessibilityRole="radio" accessibilityState={{ checked: provinceId === item.id }} key={item.id} onPress={() => setProvinceId(item.id)} style={[styles.chip, provinceId === item.id && styles.active]}>'
              ),
              (
                  '<Pressable onPress={() => void choosePhoto()} style={styles.secondary}>',
                  '<Pressable accessibilityRole="button" onPress={() => void choosePhoto()} style={styles.secondary}>'
              ),
              (
                  '<Pressable onPress={() => void continueToSelfie()} style={styles.primary}>',
                  '<Pressable accessibilityRole="button" onPress={() => void continueToSelfie()} style={styles.primary}>'
              ),
          ]
          for old_text, new_text in replacements:
              if old_text not in onboarding:
                  raise SystemExit(f'onboarding target not found: {old_text[:45]}')
              onboarding = onboarding.replace(old_text, new_text, 1)
          onboarding_path.write_text(onboarding)
          PY

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/mobile/app/profile/[username].tsx' apps/mobile/app/onboarding/profile.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web-r02): remove nested buttons and label onboarding controls'
          git push origin HEAD:release/luxy-web-v1
