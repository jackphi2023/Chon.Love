name: Agent UI polish patch

on:
  push:
    branches: ['agent/ui-profile-connect-messaging-polish-v1']
    paths: ['.github/workflows/agent-ui-polish-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-profile-connect-messaging-polish-v1
          fetch-depth: 0

      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Verify CLI and create migration shell
        run: |
          supabase --version
          supabase migration new --help >/dev/null
          supabase migration new ui_profile_connect_polish

      - name: Apply exact scoped patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:90]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              si = text.find(start)
              if si < 0:
                  raise SystemExit(f'{path}: start marker missing: {start[:80]!r}')
              ei = text.find(end, si + len(start))
              if ei < 0:
                  raise SystemExit(f'{path}: end marker missing: {end[:80]!r}')
              write(path, text[:si] + start + replacement + text[ei:])

          # 1) Membership badge: preserve existing defaults; add explicit placement/size opt-ins.
          p = 'apps/mobile/src/components/chon-membership-badge.tsx'
          replace_once(p,
          """  variant = 'icon',\n  inset = 2,\n  width,\n}: {\n""",
          """  variant = 'icon',\n  inset = 2,\n  width,\n  placement = 'top-left',\n  size,\n}: {\n""")
          replace_once(p,
          """  variant?: ChonMembershipBadgeVariant;\n  inset?: number;\n  width?: number;\n}) {\n  if (!isChonMembershipBadgeTier(tier)) return null;\n  const resolved = resolveChonMembershipBadgeAsset({ desktop, tier, variant, width });\n""",
          """  variant?: ChonMembershipBadgeVariant;\n  inset?: number;\n  width?: number;\n  placement?: 'top-left' | 'top-right';\n  size?: 'small' | 'medium' | 'large';\n}) {\n  if (!isChonMembershipBadgeTier(tier)) return null;\n  const resolvedVariant = size === 'large' ? 'certificate' : size ? 'icon' : variant;\n  const resolvedDesktop = size ? size !== 'small' : desktop;\n  const resolved = resolveChonMembershipBadgeAsset({ desktop: resolvedDesktop, tier, variant: resolvedVariant, width });\n""")
          replace_once(p,
          """        { height: resolved.height, left: inset, top: inset, width: resolved.width },\n""",
          """        { height: resolved.height, top: inset, width: resolved.width },\n        placement === 'top-right' ? { right: inset } : { left: inset },\n""")

          p = 'apps/mobile/src/components/chon-member-photo.tsx'
          replace_once(p,
          """  badgeInset,\n  fallbackFontSize,\n""",
          """  badgeInset,\n  membershipBadgePlacement = 'top-left',\n  membershipBadgeSize,\n  photoCountTopOffset,\n  fallbackFontSize,\n""")
          replace_once(p,
          """  badgeInset?: number | undefined;\n  fallbackFontSize?: number | undefined;\n""",
          """  badgeInset?: number | undefined;\n  membershipBadgePlacement?: 'top-left' | 'top-right' | undefined;\n  membershipBadgeSize?: 'small' | 'medium' | 'large' | undefined;\n  photoCountTopOffset?: number | undefined;\n  fallbackFontSize?: number | undefined;\n""")
          replace_once(p,
          """        inset={badgeInset ?? (desktop ? 8 : 7)}\n        tier={membershipTier}\n        variant=\"icon\"\n""",
          """        inset={badgeInset ?? (desktop ? 8 : 7)}\n        placement={membershipBadgePlacement}\n        size={membershipBadgeSize}\n        tier={membershipTier}\n        variant=\"icon\"\n""")
          replace_once(p,
          """            desktop && photoCountPlacement === 'top-right' ? styles.photoCountTopDesktop : null,\n""",
          """            desktop && photoCountPlacement === 'top-right' ? styles.photoCountTopDesktop : null,\n            photoCountPlacement === 'top-right' && photoCountTopOffset !== undefined ? { top: photoCountTopOffset } : null,\n""")

          p = 'apps/mobile/src/components/chon-connect-member-card.tsx'
          replace_once(p,
          """          membershipTier={profile.membership_badge_tier}\n          name={name}\n          photoCount={profile.photo_count}\n""",
          """          membershipBadgePlacement=\"top-right\"\n          membershipBadgeSize=\"medium\"\n          membershipTier={profile.membership_badge_tier}\n          name={name}\n          photoCount={profile.photo_count}\n          photoCountTopOffset={42}\n""")

          # 2) Connect stable total count + location invalidation.
          p = 'packages/supabase/src/search.ts'
          insertion = r'''

