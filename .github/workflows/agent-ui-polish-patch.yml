name: Agent UI polish patch

on:
  push:
    branches:
      - agent/ui-profile-connect-messaging-polish-v1
    paths:
      - .github/workflows/agent-ui-polish-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ui-profile-connect-messaging-polish-v1
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.110.0

      - name: Recover patch script from parent commit
        shell: bash
        run: |
          git show HEAD^:.github/workflows/agent-ui-polish-patch.yml > /tmp/agent-ui-polish-parent.yml
          python3 - <<'EXTRACT'
          from pathlib import Path
          text = Path('/tmp/agent-ui-polish-parent.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate patch shape"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = body.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/agent-ui-polish-patch.py').write_text(script)
          EXTRACT
          python3 -m py_compile /tmp/agent-ui-polish-patch.py

      - name: Create migration shell
        run: |
          supabase --version
          supabase migration new --help >/dev/null
          supabase migration new ui_profile_connect_polish

      - name: Apply scoped patch
        run: python3 /tmp/agent-ui-polish-patch.py

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/agent-ui-polish-patch.yml
          git diff --name-only | grep -q '^supabase/migrations/'
          git diff --name-only | grep -q '^apps/mobile/'
          git diff --name-only | grep -q '^packages/supabase/'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UI: polish connect profiles gifts messaging membership"
          git push origin HEAD:agent/ui-profile-connect-messaging-polish-v1
