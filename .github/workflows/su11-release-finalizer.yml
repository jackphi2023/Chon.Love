name: SU-11 Release Finalizer

on:
  push:
    branches:
      - feature/signup-onboarding-v2
    paths:
      - scripts/.su11-release-finalize

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/signup-onboarding-v2
          fetch-depth: 0

      - name: Apply canonical SU-11 release fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          config = Path('supabase/config.toml')
          text = config.read_text()
          old = '[local_smtp]\nenabled = false\nport = 54324'
          new = '[local_smtp]\nenabled = true\nport = 54324'
          if old not in text:
              raise SystemExit('Expected disabled local_smtp block was not found')
          config.write_text(text.replace(old, new, 1))

          test = Path('tests/br-06/web-r02-final-ui-qa.spec.mjs')
          text = test.read_text()
          old = '''  while (Date.now() < deadline) {\n    const response = await fetch(url);\n    if (response.ok) {\n      const html = await response.text();\n      const match = html.match(/\\b(\\d{6})\\b/u);\n      if (match) return match[1];\n    }\n    await new Promise((resolve) => setTimeout(resolve, 250));\n  }\n'''
          new = '''  while (Date.now() < deadline) {\n    try {\n      const response = await fetch(url);\n      if (response.ok) {\n        const html = await response.text();\n        const match = html.match(/\\b(\\d{6})\\b/u);\n        if (match) return match[1];\n      }\n    } catch {\n      // Mailpit can take a moment to become reachable after the local stack starts.\n    }\n    await new Promise((resolve) => setTimeout(resolve, 250));\n  }\n'''
          if old not in text:
              raise SystemExit('Expected readSignupOtp polling block was not found')
          test.write_text(text.replace(old, new, 1))
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9415227475/zip" > /tmp/chon-database-types.zip
          unzip -p /tmp/chon-database-types.zip database.types.ts > packages/supabase/src/database.types.ts
          test -s packages/supabase/src/database.types.ts

          rm -f .github/workflows/su11-release-finalizer.yml scripts/.su11-release-finalize

      - name: Commit final release fixes and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- supabase/config.toml tests/br-06/web-r02-final-ui-qa.spec.mjs packages/supabase/src/database.types.ts .github/workflows/su11-release-finalizer.yml scripts/.su11-release-finalize
          git diff --cached --check
          git diff --cached --quiet && { echo 'No release changes to commit'; exit 1; }
          git commit -m "fix(signup): finalize SU-11 release gates"
          git push origin HEAD:feature/signup-onboarding-v2
