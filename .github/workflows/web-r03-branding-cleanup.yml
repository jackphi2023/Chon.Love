name: WEB-R03 Branding Cleanup

on:
  push:
    branches:
      - release/luxy-web-v1
    paths:
      - scripts/web-r03-branding-cleanup.py
      - .github/workflows/web-r03-branding-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply WEB-R03 branding patch
        run: python3 scripts/web-r03-branding-cleanup.py
      - name: Normalize generated QA files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          validator = Path('scripts/validate-web-r03-branding.mjs')
          text = validator.read_text(encoding='utf-8')
          text = text.replace("console.error('WEB-R03 branding validation failed:\n' + failures.map((x) => `- ${x}`).join('\n'));", "console.error('WEB-R03 branding validation failed:\\n' + failures.map((x) => `- ${x}`).join('\\n'));")
          validator.write_text(text, encoding='utf-8')

          spec = Path('tests/br-06/web-r03-branding.spec.mjs')
          text = spec.read_text(encoding='utf-8').replace("['/', 'luxy-search-mobile'],", "['/', 'luxy-search-desktop'],")
          spec.write_text(text, encoding='utf-8')

          config = Path('packages/config/src/index.ts')
          text = config.read_text(encoding='utf-8').replace('// LX-20 product override:', '// Web V1 product override:')
          config.write_text(text, encoding='utf-8')
          PY
      - name: Keep CI workflow for connector update
        run: git checkout -- .github/workflows/ci.yml
      - name: Validate branding source
        run: node scripts/validate-web-r03-branding.mjs
      - name: Validate diff
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short)"
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(web-r03): clean Luxy.Love user-facing branding'
          git push origin HEAD:release/luxy-web-v1
