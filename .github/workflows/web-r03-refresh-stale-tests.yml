name: WEB-R03 Refresh Stale Browser Contracts

on:
  push:
    branches:
      - release/luxy-web-v1
    paths:
      - .github/workflows/web-r03-refresh-stale-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale pre-branding expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/br-06/luxy-member-profile.spec.mjs'): [
                  ('legacy approval request không mở khóa ảnh riêng tư', 'yêu cầu duyệt cũ không mở khóa ảnh riêng tư'),
              ],
              Path('tests/br-06/luxy-search-desktop.spec.mjs'): [
                  ("getByText('LX-20', { exact: true }).first()", "getByText('Sắp mở', { exact: true }).first()"),
                  ("getByText('Hoạt động gần đây', { exact: true })", "getByText('Truy cập gần đây', { exact: true })"),
              ],
              Path('tests/br-06/luxy-search-mobile.spec.mjs'): [
                  ("getByText('LX-20', { exact: true }).first()", "getByText('Sắp mở', { exact: true }).first()"),
                  ("Sắp xếp: Hoạt động gần đây", "Sắp xếp: Truy cập gần đây"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing stale expectation in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate R03 guards and diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-web-r03-branding.mjs
          git diff --check
      - name: Commit refreshed tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/br-06/luxy-member-profile.spec.mjs tests/br-06/luxy-search-desktop.spec.mjs tests/br-06/luxy-search-mobile.spec.mjs
          git commit -m 'test(web-r03): align legacy browser contracts with branding cleanup'
          git push origin HEAD:release/luxy-web-v1
