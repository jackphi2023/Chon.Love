# Chon.Love production web source of truth.
# Netlify Base directory must remain the repository root (/).
# Production deploys one responsive Expo Web application from apps/mobile.
# Do not select apps/public-web as the package/build target for the main Chon.Love site.

[build]
  command = "corepack enable && pnpm --filter @myfan/mobile build:web"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22.23.1"
  PNPM_VERSION = "10.15.1"
  EXPO_PUBLIC_FEATURE_GOOGLE_PLAY_BILLING = "false"
  EXPO_PUBLIC_FEATURE_SEND_GIFT = "false"
  EXPO_PUBLIC_FEATURE_CREATOR_WALLET = "false"
  EXPO_PUBLIC_FEATURE_CREATOR_KYC = "false"
  EXPO_PUBLIC_FEATURE_WITHDRAWAL = "false"

[context.production.environment]
  EXPO_PUBLIC_MYFAN_ENV = "production"
  EXPO_PUBLIC_SUPABASE_URL = "https://asnydvqsduonyidjyyzq.supabase.co"

# Non-production deploys are intentionally not hard-wired to the production database.
# Configure EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY per Netlify
# deploy context when a preview/staging database is available. Missing config must
# fail closed rather than silently writing test traffic to production.
[context.deploy-preview.environment]
  EXPO_PUBLIC_MYFAN_ENV = "development"

[context.branch-deploy.environment]
  EXPO_PUBLIC_MYFAN_ENV = "development"

[context.develop.environment]
  EXPO_PUBLIC_MYFAN_ENV = "development"

[context."release/staging".environment]
  EXPO_PUBLIC_MYFAN_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
